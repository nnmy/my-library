<!DOCTYPE html>
<html lang="vi" class="gate-locked">
<head>
<meta charset="utf-8">
<style>html.gate-locked body{visibility:hidden!important}</style>
<script src="../../../common/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh họa | Không dây</title>
<link rel="icon" type="image/svg+xml" href="https://nnmy.github.io/lib/logo-my.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../wl.css">
<!--
  =====================================================================
  CHẠY MINH HỌA ĐỘC LẬP  (intro-wireless/lib/demos/run.html)
  - run.html                 : danh sách mọi minh họa
  - run.html?demo=wave    : chạy một minh họa (id = tên file .js trong thư mục này)
  Thêm minh họa mới: tạo lib/demos/<id>.js (gọi WL.demo) và thêm một dòng vào DEMOS.
  =====================================================================
-->
<style>
  body { padding: 28px 0 60px; }
  .runhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 18px; }
  .runhead h1 { font-size: clamp(34px, 4.6vw, 52px); }
  .runhead a { font-weight: 600; }
  .list h2 { font-size: 30px; margin: 30px 0 10px; }
  .list ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .list a { display: block; padding: 10px 14px; background: #fff; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; }
  .list a:hover { box-shadow: 4px 4px 0 var(--sky); }
  .list small { display: block; color: var(--muted); font-weight: 400; }
</style>
</head>
<body data-no-toc>
<noscript><p style="visibility:visible;margin:40px auto;max-width:520px;padding:0 20px;font:16px system-ui,sans-serif">Trang cần bật JavaScript để xem.</p></noscript>
<main class="wrap" id="app"></main>
<script src="../wl.js"></script>
<script>
const DEMOS = [
  { id: 'wave', domId: 'demoWave', title: 'Tần số và bước sóng', page: '1-song-vo-tuyen.html', pageTitle: 'Sóng vô tuyến' },
  { id: 'spectrum', domId: 'demoSpectrum', title: 'Bản đồ phổ tần', page: '1-song-vo-tuyen.html', pageTitle: 'Sóng vô tuyến' },
  { id: 'path-loss', domId: 'demoLoss', title: 'Sóng yếu đi theo khoảng cách', page: '1-song-vo-tuyen.html', pageTitle: 'Sóng vô tuyến' },
  { id: 'modulation', domId: 'demoMod', title: 'Gắn bit lên sóng mang', page: '2-dieu-che.html', pageTitle: 'Chở dữ liệu trên sóng' },
  { id: 'constellation', domId: 'demoQam', title: 'Chòm điểm QAM và nhiễu', page: '2-dieu-che.html', pageTitle: 'Chở dữ liệu trên sóng' },
  { id: 'induction', domId: 'demoInd', title: 'Hai cuộn dây ghép từ', page: '3-nfc-qi.html', pageTitle: 'NFC và sạc không dây Qi' },
  { id: 'ism-band', domId: 'demoIsm', title: 'Dải 2,4 GHz chật chội', page: '4-bluetooth-wifi.html', pageTitle: 'Bluetooth, AirDrop và Wi-Fi' },
  { id: 'cells', domId: 'demoCells', title: 'Ô mạng di động và chuyển vùng', page: '5-di-dong.html', pageTitle: 'Mạng di động 4G LTE' },
  { id: 'trilateration', domId: 'demoTri', title: 'Định vị bằng thời gian', page: '6-ve-tinh.html', pageTitle: 'Vệ tinh: GNSS và Starlink' },
  { id: 'orbits', domId: 'demoOrbits', title: 'Quỹ đạo thấp, trung bình, địa tĩnh', page: '6-ve-tinh.html', pageTitle: 'Vệ tinh: GNSS và Starlink' },
  { id: 'phased-array', domId: 'demoArray', title: 'Lái chùm sóng bằng mảng ăng-ten', page: '6-ve-tinh.html', pageTitle: 'Vệ tinh: GNSS và Starlink' },
  { id: 'tissue', domId: 'demoTissue', title: 'Sóng đi xuyên cơ thể', page: '7-y-te.html', pageTitle: 'Không dây trong y tế' },
  { id: 'jam', domId: 'demoJam', title: 'Nhiễu nền và phá sóng', page: '8-suy-hao-pha-song.html', pageTitle: 'Suy hao và phá sóng' }
];
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('demo');
const d = DEMOS.find(x => x.id === id);
if (d) {
  document.title = d.title + ' | Không dây';
  app.innerHTML = `<div class="runhead"><h1>${d.title}</h1><span><a href="run.html">Tất cả minh họa</a>  |  <a href="../../${d.page}#${d.domId}">Xem trong trang "${d.pageTitle}"</a></span></div>
    <div class="demo" id="${d.domId}" data-demo="${d.id}"><div class="demo-loading">Đang tải…</div></div>`;
  WL.mountDemo(app.querySelector('.demo'), d.id);
} else {
  const groups = {};
  DEMOS.forEach(x => (groups[x.pageTitle] = groups[x.pageTitle] || []).push(x));
  app.innerHTML = `<div class="runhead"><h1>Minh họa Không dây</h1><a href="../../index.html">Trang chủ Không dây</a></div>
    <p class="note-s">Mỗi minh họa có thể chạy riêng ở đây, hoặc nhúng vào trang bằng một thẻ &lt;div data-demo&gt; và lib/wl.js.</p>
    <div class="list">${Object.entries(groups).map(([g, xs]) => `<h2>${g}</h2><ul>${xs.map(x => `<li><a href="run.html?demo=${x.id}">${x.title}<small>${x.id}.js</small></a></li>`).join('')}</ul>`).join('')}</div>`;
}
</script>
</body>
</html>
