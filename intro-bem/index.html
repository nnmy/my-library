<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; list-style: none; padding: 0; margin: 0 0 40px; }
  .card { display: flex; flex-direction: column; height: 100%; background: #fff; color: var(--ink); text-decoration: none;
    border: 2px solid var(--ink); box-shadow: 0 6px 18px rgba(27,25,32,.10); padding: 20px 20px 18px; transition: transform .15s, box-shadow .15s; }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(27,25,32,.16); }
  .card.soon { box-shadow: 0 4px 12px rgba(27,25,32,.06); border-color: #9DA4AD; color: var(--muted); }
  .card.soon .icon { opacity: .45; filter: grayscale(.6); }
  .card-body { display: flex; align-items: flex-start; gap: 16px; flex: 1; }
  .icon { display: block; flex: none; align-self: center; }   /* pixel art canh giữa theo chiều dọc */
  .card h3 .num { color: var(--sea); margin-right: 12px; }
  .card.soon .num { color: var(--muted); }
  .card h3 { margin: 2px 0 6px; font: 400 30px/1.05 var(--pixel-vi); }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; text-align: justify; hyphens: auto; }
  .page-head .lead { text-align: justify; hyphens: auto; }
  .grid > li, .card h3 { text-align: left; }
  .page-head h1 { align-items: flex-start; }
  .page-head h1 .dot { margin-top: .42em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
  .tags li { font-size: 12.5px; padding: 1px 9px; background: var(--mist); border: 1px solid var(--line); color: var(--ink); }
  .badge { align-self: flex-start; margin-top: 12px; font-size: 12.5px; font-weight: 600; padding: 1px 8px; border: 1px dashed #9DA4AD; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } a.card:hover { transform: none; } }
</style>

<script>
/* =====================================================================

const PAGES = [
  {
    num: '1', name: 'Điện', href: '1-dien.html', done: true,
    desc: 'Điện tích, điện trường, điện thế và dòng điện.',
    tags: ['Charge', 'Electric potential', 'Current'],
    iconColors: { o: '#1B1920', y: '#f2c230', w: '#fff3c9' },
    icon: [
      '.....oooooo',
      '....oyyyyo.',
      '...oyyyyo..',
      '..oywyyo...',
      '.oyyyyooooo',
      'oyyyyyyyyo.',
      'oooooyyyo..',
      '....oyyo...',
      '...oyyo....',
      '..oyyo.....',
      '.oyo.......',
      '.oo........',
    ],
  },
  {
    num: '2', name: 'Từ', href: '2-tu.html', done: true,
    desc: 'Từ trường của dòng điện, lực Lorentz và nam châm.',
    tags: ['Biot–Savart', 'Lorentz force', 'Magnet'],
    iconColors: { o: '#1B1920', r: '#d8312a', b: '#3787c4', w: '#E2E6EA' },
    icon: [
      '...oooooo...',
      '..orrrbbbo..',
      '.orroooobbo.',
      '.orro..obbo.',
      '.orro..obbo.',
      '.orro..obbo.',
      '.orro..obbo.',
      '.owwo..owwo.',
      '.owwo..owwo.',
      '.oooo..oooo.',
    ],
  },
  {
    num: '3', name: 'Các phương trình Maxwell', href: '3-maxwell.html', done: true,
    desc: 'Bốn phương trình Maxwell và sóng điện từ.',
    tags: ['Gauss', 'Faraday', 'Ampère–Maxwell'],
    iconColors: { o: '#1B1920', s: '#3787c4', r: '#d8312a' },
    icon: [
      '..ss......ss',

      'oooooooooooo',

      '...rr.....rr',

      '.r....r.r...',

    ],
  },
  {
    num: '4', name: 'Điện môi của mô', href: '4-dien-moi.html', done: true,
    desc: 'σ và ε của mô, tán sắc và mô hình Cole–Cole.',
    tags: ['Conductivity', 'Permittivity', 'Cole–Cole'],

  {
    num: '5', name: 'Đo liều', href: '5-do-lieu.html', done: true,
    desc: 'Điện trường cảm ứng, SAR, mô phỏng FDTD và FEM.',

    desc: 'FEM (Phương pháp phần tử hữu hạn) & ứng dụng.',

    desc: 'Mô hình người toàn thân cho đo liều số: cách dựng và cách dùng.',
    tags: ['Voxel phantom', 'Virtual Population', 'Resolution'],
  },
];

const SVG_NS = 'http://www.w3.org/2000/svg';
function iconSVG(p) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  const W = Math.max(...p.icon.map(r => r.length)), H = p.icon.length, CELL = 6;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W * CELL); svg.setAttribute('height', H * CELL);
  svg.setAttribute('class', 'icon'); svg.setAttribute('shape-rendering', 'crispEdges'); svg.setAttribute('aria-hidden', 'true');
  p.icon.forEach((row, y) => [...row].forEach((ch, x) => {
    const fill = p.iconColors[ch]; if (!fill) return;
    const r = document.createElementNS(SVG_NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', 1); r.setAttribute('height', 1); r.setAttribute('fill', fill);
    svg.appendChild(r);
  }));
  return svg;
}
const list = document.getElementById('pages');
PAGES.forEach(p => {
  const li = document.createElement('li');
  const card = document.createElement(p.done ? 'a' : 'div');
  card.className = 'card' + (p.done ? '' : ' soon');
  if (p.done) card.href = p.href; else card.setAttribute('aria-disabled', 'true');
  const body = document.createElement('div'); body.className = 'card-body';
  const text = document.createElement('div');
  const h = document.createElement('h3');
  const num = document.createElement('span'); num.className = 'num'; num.textContent = p.num;
  h.append(num, document.createTextNode(p.name));   // số phần + tiêu đề trên cùng một dòng
  const d = document.createElement('p'); d.textContent = p.desc;
  text.append(h, d);
  if (p.icon) body.append(iconSVG(p));   // thẻ không khai báo icon thì không có pixel art
  body.append(text);
  const tags = document.createElement('ul'); tags.className = 'tags';
  (p.tags || []).slice(0, 3).forEach(t => { const x = document.createElement('li'); x.textContent = t; tags.appendChild(x); });
  card.append(body);
  if (tags.children.length) card.append(tags);
  if (!p.done) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'Sắp có'; card.appendChild(b); }
  li.appendChild(card); list.appendChild(li);
});
</script>
