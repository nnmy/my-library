<!DOCTYPE html>
<html lang="vi" class="gate-locked">
<head>
<meta charset="utf-8">
<style>html.gate-locked body{visibility:hidden!important}</style>
<script src="../../../common/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh họa | Bioelectromagnetics</title>
<link rel="icon" type="image/svg+xml" href="https://nnmy.github.io/lib/logo-my.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bem.css">
<!--
  =====================================================================
  CHẠY MINH HỌA ĐỘC LẬP  (intro-bem/lib/demos/run.html)
  - run.html                 : danh sách mọi minh họa
  - run.html?demo=coulomb    : chạy một minh họa (id = tên file .js trong thư mục này)
  Thêm minh họa mới: tạo lib/demos/<id>.js (gọi BEM.demo) và thêm một dòng vào DEMOS.
  =====================================================================
-->
<style>
  body { padding: 28px 0 60px; }
  .runhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 18px; }
  .runhead h1 { font-size: clamp(34px, 4.6vw, 52px); }
  .runhead a { font-weight: 600; }
  .list h2 { font-size: 30px; margin: 30px 0 10px; }
  .list ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .list a { display: block; padding: 10px 14px; background: #fff; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; }
  .list a:hover { box-shadow: 4px 4px 0 var(--sky); }
  .list small { display: block; color: var(--muted); font-weight: 400; }
</style>
</head>
<body data-no-toc>
<noscript><p style="visibility:visible;margin:40px auto;max-width:520px;padding:0 20px;font:16px system-ui,sans-serif">Trang cần bật JavaScript để xem.</p></noscript>
<main class="wrap" id="app"></main>
<script src="../bem.js"></script>
<script>
const DEMOS = [
  { id: 'coulomb', domId: 'demoCoulomb', title: 'Hai điện tích', page: '1-dien.html', pageTitle: 'Điện' },
  { id: 'potential', domId: 'demoPotential', title: 'Địa hình điện thế', page: '1-dien.html', pageTitle: 'Điện' },
  { id: 'current', domId: 'demoCurrent', title: 'Dòng điện trong vật dẫn', page: '1-dien.html', pageTitle: 'Điện' },
  { id: 'wires', domId: 'demoWires', title: 'Dây dẫn và từ trường', page: '2-tu.html', pageTitle: 'Từ' },
  { id: 'lorentz', domId: 'demoLorentz', title: 'Hạt mang điện trong từ trường đều', page: '2-tu.html', pageTitle: 'Từ' },
  { id: 'magnets', domId: 'demoMagnets', title: 'Nam châm, Trái Đất và la bàn', page: '2-tu.html', pageTitle: 'Từ' },
  { id: 'gauss-e', domId: 'demoGaussE', title: 'Mặt Gauss', page: '3-maxwell.html', pageTitle: 'Các phương trình Maxwell' },
  { id: 'gauss-b', domId: 'demoGaussB', title: 'Thông lượng từ qua đường cong kín', page: '3-maxwell.html', pageTitle: 'Các phương trình Maxwell' },
  { id: 'faraday', domId: 'demoFaraday', title: 'Nam châm và cuộn dây', page: '3-maxwell.html', pageTitle: 'Các phương trình Maxwell' },
  { id: 'ampere', domId: 'demoAmpere', title: 'Tụ điện đang nạp', page: '3-maxwell.html', pageTitle: 'Các phương trình Maxwell' },
  { id: 'wave', domId: 'demoWave', title: 'Sóng điện từ đi vào mô', page: '3-maxwell.html', pageTitle: 'Các phương trình Maxwell' },
  { id: 'debye-cole', domId: 'demoDebye', title: 'Debye và Cole–Cole: một vùng tán sắc', page: '4-dien-moi.html', pageTitle: 'Tính chất điện môi của mô' },
  { id: 'gabriel', domId: 'demoGabriel', title: 'Phổ điện môi của mô (mô hình Gabriel)', page: '4-dien-moi.html', pageTitle: 'Tính chất điện môi của mô' },
  { id: 'penetration', domId: 'demoDepth', title: 'Độ xuyên sâu và lớp mô', page: '4-dien-moi.html', pageTitle: 'Tính chất điện môi của mô' },
  { id: 'induced', domId: 'demoInduced', title: 'Điện trường cảm ứng trong đĩa mô', page: '5-do-lieu.html', pageTitle: 'Đo liều' },
  { id: 'sar-heat', domId: 'demoSar', title: 'SAR, SA và nhiệt độ', page: '5-do-lieu.html', pageTitle: 'Đo liều' },
  { id: 'fdtd', domId: 'demoFdtd', title: 'Mô phỏng FDTD: sóng phẳng chiếu vào mô', page: '5-do-lieu.html', pageTitle: 'Đo liều' },
  { id: 'fem', domId: 'demoFem', title: 'Mô phỏng FEM: dòng điện tDCS trong đầu', page: '5-do-lieu.html', pageTitle: 'Đo liều' },
  { id: 'fem-1d', domId: 'demoFem1d', title: 'FEM một chiều: hàm nón, nghiệm và sai số', page: '6-fem.html', pageTitle: 'FEM' },
  { id: 'fem-assembly', domId: 'demoFemAsm', title: 'Lắp ráp ma trận độ cứng và tính thưa', page: '6-fem.html', pageTitle: 'FEM' },
  { id: 'eeg-forward', domId: 'demoEeg', title: 'Bài toán thuận EEG: lưỡng cực trong đầu', page: '6-fem.html', pageTitle: 'FEM' },
  { id: 'dbs', domId: 'demoDbs', title: 'Kích thích não sâu (DBS): trường quanh điện cực', page: '6-fem.html', pageTitle: 'FEM' },
  { id: 'voxel-slice', domId: 'demoVoxel', title: 'Độ phân giải của mô hình voxel', page: '7-mo-hinh-voxel.html', pageTitle: 'Mô hình voxel toàn thân' }
];
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('demo');
const d = DEMOS.find(x => x.id === id);
if (d) {
  document.title = d.title + ' | Bioelectromagnetics';
  app.innerHTML = `<div class="runhead"><h1>${d.title}</h1><span><a href="run.html">Tất cả minh họa</a>  |  <a href="../../${d.page}#${d.domId}">Xem trong trang "${d.pageTitle}"</a></span></div>
    <div class="demo" id="${d.domId}" data-demo="${d.id}"><div class="demo-loading">Đang tải…</div></div>`;
  BEM.mountDemo(app.querySelector('.demo'), d.id);
} else {
  const groups = {};
  DEMOS.forEach(x => (groups[x.pageTitle] = groups[x.pageTitle] || []).push(x));
  app.innerHTML = `<div class="runhead"><h1>Minh họa Bioelectromagnetics</h1><a href="../../index.html">Trang chủ Bioelectromagnetics</a></div>
    <p class="note-s">Mỗi minh họa có thể chạy riêng ở đây, hoặc nhúng vào trang bằng một thẻ &lt;div data-demo&gt; và lib/bem.js.</p>
    <div class="list">${Object.entries(groups).map(([g, xs]) => `<h2>${g}</h2><ul>${xs.map(x => `<li><a href="run.html?demo=${x.id}">${x.title}<small>${x.id}.js</small></a></li>`).join('')}</ul>`).join('')}</div>`;
}
</script>
</body>
</html>
