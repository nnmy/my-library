<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Một neuron nhân tạo: cộng có trọng số rồi qua hàm kích hoạt</title>
  <!-- Tự vẽ. My Academia / AI. Ví dụ: có nên đi cà phê với bạn không. -->
  <rect width="860" height="300" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <text x="20" y="28" font-weight="700" font-size="15">Đầu vào x (0 hoặc 1)</text>
  <g>
    <rect x="20" y="52" width="170" height="44" fill="#fff" stroke="#1B1920" stroke-width="2"/>
    <text x="32" y="72">trời mát</text><text x="32" y="88" font-size="11.5" fill="#59606B">x₁ = 1</text>
    <rect x="20" y="128" width="170" height="44" fill="#fff" stroke="#1B1920" stroke-width="2"/>
    <text x="32" y="148">có bạn rủ</text><text x="32" y="164" font-size="11.5" fill="#59606B">x₂ = 1</text>
    <rect x="20" y="204" width="170" height="44" fill="#fff" stroke="#1B1920" stroke-width="2"/>
    <text x="32" y="224">cuối tháng hết tiền</text><text x="32" y="240" font-size="11.5" fill="#59606B">x₃ = 0</text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M192 74 L392 140" stroke="#3787c4" stroke-width="3"/>
    <path d="M192 150 L392 150" stroke="#3787c4" stroke-width="6"/>
    <path d="M192 226 L392 160" stroke="#d8312a" stroke-width="4" stroke-dasharray="7 4"/>
  </g>
  <g font-weight="600" font-size="13">
    <rect x="222" y="78" width="78" height="22" fill="#DCEFF8" stroke="#1B1920"/><text x="230" y="94">w₁ = 0,5</text>
    <rect x="222" y="125" width="78" height="22" fill="#DCEFF8" stroke="#1B1920"/><text x="234" y="141">w₂ = 2</text>
    <rect x="222" y="200" width="86" height="22" fill="#F6D6D2" stroke="#1B1920"/><text x="228" y="216">w₃ = −1,5</text>
  </g>
  <circle cx="430" cy="150" r="38" fill="#fff" stroke="#1B1920" stroke-width="2"/>
  <text x="430" y="160" text-anchor="middle" font-size="30">Σ</text>
  <text x="430" y="210" text-anchor="middle" font-size="12">cộng hết lại, thêm b = −1</text>
  <text x="430" y="228" text-anchor="middle" font-size="12" fill="#59606B">z = 0,5·1 + 2·1 − 1,5·0 − 1 = 1,5</text>
  <path d="M470 150H540" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
  <rect x="544" y="96" width="130" height="110" fill="#F6E3B0" stroke="#1B1920" stroke-width="2"/>
  <text x="609" y="116" text-anchor="middle" font-weight="700">hàm kích hoạt</text>
  <path d="M560 194 C596 194 600 190 609 164 S 622 134 660 134" fill="none" stroke="#1B1920" stroke-width="2.4"/>
  <path d="M556 164H664M609 128V200" stroke="#9DA4AD" stroke-width="1"/>
  <path d="M676 150H736" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
  <rect x="740" y="118" width="104" height="64" fill="#D5EDDD" stroke="#1B1920" stroke-width="2"/>
  <text x="792" y="144" text-anchor="middle" font-weight="700" font-size="18">0,82</text>
  <text x="792" y="164" text-anchor="middle" font-size="12">→ đi uống!</text>
  <text x="430" y="278" text-anchor="middle" font-size="12.5" fill="#59606B">Dây đậm = trọng số lớn (yếu tố quan trọng). Dây đỏ đứt = trọng số âm (yếu tố kéo quyết định về phía “hổng đi”).</text>
</svg>
