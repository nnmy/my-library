<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Vòng lặp của một AI agent</title>
  <!-- Tự vẽ, giản lược theo mẫu ReAct (Yao et al. 2022). My Academia / AI. -->
  <rect width="760" height="260" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <g text-anchor="middle">
    <rect x="20" y="105" width="130" height="50" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="85" y="128">mục tiêu</text><text x="85" y="145" font-size="11.5" fill="#59606B">"đặt lịch họp…"</text>
    <path d="M152 130H220" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="224" y="90" width="150" height="80" fill="#E3D7F2" stroke="#1B1920" stroke-width="2"/>
    <text x="299" y="122" font-weight="700" font-size="15">LLM</text><text x="299" y="142" font-size="12">suy nghĩ → chọn</text><text x="299" y="157" font-size="12">hành động tiếp theo</text>
    <path d="M376 110C440 60 480 60 520 70" fill="none" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <text x="450" y="50" font-size="12">gọi công cụ (JSON)</text>
    <rect x="524" y="40" width="210" height="64" fill="#f2c230" stroke="#1B1920" stroke-width="2"/>
    <text x="629" y="64" font-weight="700">Công cụ / môi trường</text><text x="629" y="83" font-size="12">tìm kiếm, chạy code, lịch,</text><text x="629" y="98" font-size="12">trình duyệt, API, MCP…</text>
    <path d="M629 106C629 170 470 190 380 160" fill="none" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <text x="580" y="212" font-size="12">kết quả quan sát được, đưa lại vào ngữ cảnh</text>
    <path d="M299 172V214" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="224" y="218" width="150" height="34" fill="#D5EDDD" stroke="#1B1920" stroke-width="2"/><text x="299" y="240">xong → trả lời</text>
  </g>
