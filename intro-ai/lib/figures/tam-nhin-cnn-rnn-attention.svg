<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Một token "nhìn" được bao xa: CNN, RNN và self-attention</title>
  <!-- Tự vẽ. My Academia / AI. -->
  <rect width="900" height="330" fill="#FBFCFD"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3787c4"/></marker>
  </defs>

  <!-- ===== CNN ===== -->
  <text x="140" y="30" text-anchor="middle" font-weight="700" font-size="16">CNN: tầm nhìn cục bộ</text>
  <g transform="translate(35,52)" stroke="#1B1920" stroke-width="1">
    <!-- 7x7 lưới, ô 30px -->
    <g fill="#FFFFFF">
      <rect x="0" y="0" width="210" height="210"/>
    </g>
    <rect x="30" y="30" width="150" height="150" fill="#DCEFF8"/>
    <rect x="60" y="60" width="90" height="90" fill="#7bcde8"/>
    <rect x="90" y="90" width="30" height="30" fill="#3787c4"/>
    <g fill="none" stroke="#B9C1CA">
      <path d="M30 0V210M60 0V210M90 0V210M120 0V210M150 0V210M180 0V210M0 30H210M0 60H210M0 90H210M0 120H210M0 150H210M0 180H210"/>
    </g>
    <rect x="0" y="0" width="210" height="210" fill="none" stroke="#1B1920" stroke-width="2"/>
  </g>
  <g font-size="12.5">
    <rect x="35" y="276" width="12" height="12" fill="#7bcde8" stroke="#1B1920"/><text x="53" y="287">sau 1 lớp 3×3: thấy 3×3</text>
    <rect x="35" y="296" width="12" height="12" fill="#DCEFF8" stroke="#1B1920"/><text x="53" y="307">sau 2 lớp: thấy 5×5</text>
  </g>

  <!-- ===== RNN ===== -->
  <text x="450" y="30" text-anchor="middle" font-weight="700" font-size="16">RNN: tuần tự, từng bước</text>
  <g font-size="13" text-anchor="middle">
    <g stroke="#1B1920" stroke-width="2" fill="#fff">
      <rect x="318" y="120" width="44" height="40"/><rect x="384" y="120" width="44" height="40"/><rect x="450" y="120" width="44" height="40"/><rect x="516" y="120" width="44" height="40"/>
    </g>
    <text x="340" y="145">h₁</text><text x="406" y="145">h₂</text><text x="472" y="145">h₃</text><text x="538" y="145">h₄</text>
    <g stroke="#1B1920" stroke-width="2" marker-end="url(#ar)">
      <path d="M362 140H382"/><path d="M428 140H448"/><path d="M494 140H514"/>
      <path d="M340 200V164"/><path d="M406 200V164"/><path d="M472 200V164"/><path d="M538 200V164"/>
    </g>
    <text x="340" y="218">Con</text><text x="406" y="218">mèo</text><text x="472" y="218">đuổi</text><text x="538" y="218">nó</text>
  </g>
  <text x="450" y="270" text-anchor="middle" font-size="12.5">"nó" chỉ biết "mèo" qua 2 bước nén trung gian;</text>
  <text x="450" y="288" text-anchor="middle" font-size="12.5">câu dài thì thông tin đầu câu phai dần,</text>
  <text x="450" y="306" text-anchor="middle" font-size="12.5">và không tính song song được theo chiều dài.</text>

  <!-- ===== Attention ===== -->
  <text x="760" y="30" text-anchor="middle" font-weight="700" font-size="16">Self-attention: thấy tất cả</text>
  <g font-size="13" text-anchor="middle">
    <g fill="none" stroke="#3787c4" stroke-width="2.4" marker-end="url(#ab)">
      <path d="M850 196C850 100 662 100 662 192" stroke-width="1.6"/>
      <path d="M850 196C850 120 728 120 728 192" stroke-width="4.5"/>
      <path d="M850 196C850 150 794 150 794 192" stroke-width="2.6"/>
    </g>
    <g stroke="#1B1920" stroke-width="2" fill="#fff">
      <rect x="640" y="196" width="44" height="30"/><rect x="706" y="196" width="44" height="30"/><rect x="772" y="196" width="44" height="30"/><rect x="828" y="196" width="44" height="30" fill="#f2c230"/>
    </g>
    <text x="662" y="216">Con</text><text x="728" y="216">mèo</text><text x="794" y="216">đuổi</text><text x="850" y="216">nó</text>
  </g>
  <text x="760" y="270" text-anchor="middle" font-size="12.5">mỗi token nối trực tiếp với mọi token khác</text>
  <text x="760" y="288" text-anchor="middle" font-size="12.5">trong 1 lớp; độ đậm = trọng số attention.</text>
  <text x="760" y="306" text-anchor="middle" font-size="12.5">Cái giá: chi phí tăng theo n².</text>
  <path d="M300 50V310M610 50V310" stroke="#DCE6EC" stroke-width="2"/>
</svg>
