<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Quy trình RAG: lập chỉ mục và truy vấn</title>
  <!-- Tự vẽ, giản lược theo Lewis et al. 2020. My Academia / AI. -->
  <rect width="860" height="270" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <text x="20" y="28" font-weight="700" font-size="14">Lập chỉ mục (làm một lần)</text>
  <g text-anchor="middle">
    <rect x="20" y="42" width="120" height="50" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="80" y="65">tài liệu</text><text x="80" y="82" font-size="11.5" fill="#59606B">PDF, wiki, email…</text>
    <path d="M142 67H180" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="184" y="42" width="120" height="50" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="244" y="65">cắt đoạn</text><text x="244" y="82" font-size="11.5" fill="#59606B">200–1 000 token</text>
    <path d="M306 67H344" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="348" y="42" width="140" height="50" fill="#7bcde8" stroke="#1B1920" stroke-width="2"/><text x="418" y="65" font-weight="700">embedding model</text><text x="418" y="82" font-size="11.5">đoạn → vector</text>
    <path d="M490 67H528" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <path d="M532 50C532 40 632 40 632 50V100C632 110 532 110 532 100Z" fill="#f2c230" stroke="#1B1920" stroke-width="2"/><path d="M532 50C532 60 632 60 632 50" fill="none" stroke="#1B1920" stroke-width="2"/>
    <text x="582" y="82" font-weight="700">vector DB</text>
  </g>
  <text x="20" y="150" font-weight="700" font-size="14">Mỗi câu hỏi</text>
  <g text-anchor="middle">
    <rect x="20" y="164" width="120" height="50" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="80" y="194">câu hỏi</text>
    <path d="M142 189H344" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="348" y="164" width="140" height="50" fill="#7bcde8" stroke="#1B1920" stroke-width="2"/><text x="418" y="194" font-weight="700">embedding model</text>
    <path d="M490 189H528" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="532" y="164" width="100" height="50" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="582" y="186">tìm top-k</text><text x="582" y="203" font-size="11.5" fill="#59606B">cosine gần nhất</text>
    <path d="M582 112V160" stroke="#1B1920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <path d="M634 189H672" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="676" y="150" width="164" height="78" fill="#E3D7F2" stroke="#1B1920" stroke-width="2"/>
    <text x="758" y="176" font-weight="700">LLM</text><text x="758" y="195" font-size="12">prompt = chỉ dẫn</text><text x="758" y="211" font-size="12">+ k đoạn + câu hỏi</text>
    <path d="M758 230V250" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <text x="758" y="266">câu trả lời có trích dẫn</text>
    <path d="M80 216V240H676" fill="none" stroke="#1B1920" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
</svg>
