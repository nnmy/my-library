<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1B1920">
  <title>Kiến trúc Transformer kiểu decoder-only (pre-norm), như GPT và Llama</title>
  <!-- Tự vẽ, giản lược. Tham khảo: Vaswani et al. 2017 (Hình 1) và cấu trúc pre-norm của GPT-2 / Llama. My Academia / AI. -->
  <rect width="760" height="640" fill="#FBFCFD"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker>
  </defs>
  <g text-anchor="middle">
    <!-- đầu vào -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="13">
      <rect x="150" y="590" width="60" height="28" fill="#DCEFF8" stroke="#1B1920"/><text x="180" y="609">▁Con</text>
      <rect x="215" y="590" width="60" height="28" fill="#F6E3B0" stroke="#1B1920"/><text x="245" y="609">▁mèo</text>
      <rect x="280" y="590" width="60" height="28" fill="#E3D7F2" stroke="#1B1920"/><text x="310" y="609">▁đuổi</text>
      <rect x="345" y="590" width="60" height="28" fill="#D5EDDD" stroke="#1B1920"/><text x="375" y="609">…</text>
    </g>
    <text x="520" y="609" text-anchor="start" fill="#59606B">n token đầu vào (ID)</text>
    <path d="M278 588V562" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="160" y="520" width="236" height="40" fill="#fff" stroke="#1B1920" stroke-width="2"/>
    <text x="278" y="545">Embedding (+ vị trí)</text>
    <text x="520" y="545" text-anchor="start" fill="#59606B">ma trận n × d</text>
    <path d="M278 518V490" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>

    <!-- khối lặp -->
    <rect x="110" y="140" width="336" height="346" fill="#EEF6FA" stroke="#1B1920" stroke-width="2.5"/>
    <text x="470" y="160" text-anchor="start" font-weight="700" font-size="22">× L lớp</text>
    <text x="470" y="182" text-anchor="start" fill="#59606B" font-size="13">GPT-2 small: L = 12, d = 768</text>
    <text x="470" y="200" text-anchor="start" fill="#59606B" font-size="13">Llama 3 8B: L = 32, d = 4096</text>

    <!-- luồng chính -->
    <path d="M278 486V470" stroke="#1B1920" stroke-width="2"/>
    <circle cx="278" cy="462" r="0" fill="none"/>
    <path d="M278 470V446" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="200" y="410" width="156" height="34" fill="#fff" stroke="#1B1920" stroke-width="1.5"/><text x="278" y="432">LayerNorm</text>
    <path d="M278 410V392" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="170" y="350" width="216" height="40" fill="#7bcde8" stroke="#1B1920" stroke-width="2"/><text x="278" y="375" font-weight="700">Masked multi-head attention</text>
    <path d="M278 350V330" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <circle cx="278" cy="318" r="12" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="278" y="323" font-size="18">+</text>
    <!-- residual 1 -->
    <path d="M278 470H140V318H262" fill="none" stroke="#3787c4" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="126" y="398" fill="#3787c4" font-size="12.5" transform="rotate(-90 126 398)">residual</text>

    <path d="M278 306V286" stroke="#1B1920" stroke-width="2"/>
    <path d="M278 286V266" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="200" y="230" width="156" height="34" fill="#fff" stroke="#1B1920" stroke-width="1.5"/><text x="278" y="252">LayerNorm</text>
    <path d="M278 230V212" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="170" y="170" width="216" height="40" fill="#f2c230" stroke="#1B1920" stroke-width="2"/><text x="278" y="195" font-weight="700">FFN (MLP 2 lớp)</text>
    <path d="M278 170V176" stroke="#1B1920" stroke-width="2"/>
    <path d="M278 170V150" stroke="#1B1920" stroke-width="2"/>
    <circle cx="278" cy="138" r="12" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="278" y="143" font-size="18">+</text>
    <path d="M278 290H140V138H262" fill="none" stroke="#3787c4" stroke-width="2.5" marker-end="url(#a)"/>

    <!-- đầu ra -->
    <path d="M278 126V100" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="160" y="60" width="236" height="38" fill="#fff" stroke="#1B1920" stroke-width="2"/><text x="278" y="84">LayerNorm → Linear → softmax</text>
    <path d="M278 60V40" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <text x="278" y="28" font-weight="700">xác suất token kế tiếp (|V| giá trị)</text>
  </g>
  <!-- chú thích bên phải -->
  <g font-size="13" fill="#59606B">
    <text x="470" y="360">Attention: các token trao đổi thông tin</text>
    <text x="470" y="378">với nhau (trộn theo chiều dài chuỗi).</text>
    <text x="470" y="186" dy="0"> </text>
    <text x="470" y="238">FFN: xử lý từng token riêng lẻ</text>
    <text x="470" y="256">(trộn theo chiều đặc trưng), d → 4d → d.</text>
    <text x="470" y="300">Đường xanh: kết nối tắt như ResNet,</text>
    <text x="470" y="318">giúp gradient đi qua hàng chục lớp.</text>
  </g>
</svg>
