<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Ba giai đoạn huấn luyện một LLM trò chuyện</title>
  <!-- Tự vẽ, giản lược theo Ouyang et al. 2022 (InstructGPT). My Academia / AI. -->
  <rect width="900" height="250" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <g text-anchor="middle">
    <rect x="20" y="40" width="250" height="120" fill="#DCEFF8" stroke="#1B1920" stroke-width="2"/>
    <text x="145" y="66" font-weight="700" font-size="16">1. Tiền huấn luyện</text>
    <text x="145" y="90">dự đoán token tiếp theo</text>
    <text x="145" y="110">trên ~10 nghìn tỉ token web,</text>
    <text x="145" y="130">sách, code</text>
    <text x="145" y="185" font-weight="600">→ base model</text>
    <text x="145" y="205" fill="#59606B" font-size="12">biết rất nhiều, nhưng chỉ "viết tiếp"</text>
    <text x="145" y="223" fill="#59606B" font-size="12">phần lớn chi phí tính toán</text>
    <path d="M272 100H318" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="322" y="40" width="250" height="120" fill="#F6E3B0" stroke="#1B1920" stroke-width="2"/>
    <text x="447" y="66" font-weight="700" font-size="16">2. SFT</text>
    <text x="447" y="90">tinh chỉnh có giám sát</text>
    <text x="447" y="110">trên vài chục nghìn đến vài triệu</text>
    <text x="447" y="130">cặp (câu hỏi, câu trả lời mẫu)</text>
    <text x="447" y="185" font-weight="600">→ biết làm trợ lý</text>
    <text x="447" y="205" fill="#59606B" font-size="12">học định dạng hội thoại,</text>
    <text x="447" y="223" fill="#59606B" font-size="12">làm theo chỉ dẫn</text>
    <path d="M574 100H620" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
    <rect x="624" y="40" width="256" height="120" fill="#D5EDDD" stroke="#1B1920" stroke-width="2"/>
    <text x="752" y="66" font-weight="700" font-size="16">3. Học từ phản hồi</text>
    <text x="752" y="90">RLHF / DPO: người (hoặc AI)</text>
    <text x="752" y="110">chọn câu trả lời tốt hơn;</text>
    <text x="752" y="130">RL với phần thưởng kiểm chứng được</text>
    <text x="752" y="185" font-weight="600">→ hữu ích, trung thực, an toàn</text>
    <text x="752" y="205" fill="#59606B" font-size="12">bài toán, code có đáp án:</text>
    <text x="752" y="223" fill="#59606B" font-size="12">nền tảng của mô hình suy luận</text>
  </g>
</svg>
