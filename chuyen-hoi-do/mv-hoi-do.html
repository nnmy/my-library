:root{
  --bg:#efe5d3; --ink:#2a1d14; --muted:#7a6552; --accent:#e0ad14; --btn:#e6d8c0; --bar:#d8c8ae;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17110d; --ink:#efe3cf; --muted:#a08a72; --accent:#f3c623; --btn:#2a2019; --bar:#3a2c22; }
}
:root[data-theme="dark"]{ --bg:#17110d; --ink:#efe3cf; --muted:#a08a72; --accent:#f3c623; --btn:#2a2019; --bar:#3a2c22; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;font-weight:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.stage{position:relative;width:min(100% - 24px,(100% - 96px) * 16 / 9);width:min(calc(100vw - 24px),calc((100vh - 96px) * 16 / 9));aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;border-radius:6px;background:#000}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:0;
  background:rgba(20,12,8,.18);color:#2a1d14;font:italic 500 clamp(22px,4vh,34px)/1 'Lora',Georgia,serif;cursor:pointer;border-radius:6px}
.start span{border-bottom:2px solid var(--accent);padding-bottom:6px}
.start[hidden]{display:none}
.bar{width:min(100% - 24px,1100px);flex-wrap:wrap;justify-content:center;padding:0 4px;display:flex;align-items:center;gap:10px}
.bar button{appearance:none;border:0;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;
  height:34px;min-width:34px;padding:0 12px;border-radius:17px;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="false"]{opacity:.45}
.bar button:focus-visible,.bar input:focus-visible,.start:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar select{appearance:none;border:0;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;height:34px;padding:0 12px;border-radius:17px;cursor:pointer;max-width:170px}
.bar select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:76px;text-align:right}
.rec.on{background:#b3321f;color:#fff}
.bar button:disabled{opacity:.35;cursor:not-allowed}
.busy{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,14,10,.78);color:#f6ecd8;
  font-size:14px;padding:8px 16px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.busy[hidden]{display:none}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <button class="start" id="start" aria-label="Xem phim"><span>Xem phim</span></button>
  <div class="busy" id="busy" hidden></div>
</div>
<div class="bar">
  <button id="play" aria-label="Phát hoặc tạm dừng">▶</button>
  <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Tua">
  <span class="time" id="time">0:00 / 5:06</span>
  <select id="scene" aria-label="Chọn cảnh"></select>
  <select id="txt" aria-label="Hiển thị chữ"><option value="topic">Câu chủ đề</option><option value="full">Toàn bộ mô tả</option><option value="none">Không hiện chữ</option></select>
  <button id="mus" aria-pressed="true" aria-label="Bật tắt nhạc nền">♪</button>
  <button id="mp4" class="rec" aria-label="Xuất MP4">⬇ MP4</button>
</div>

/*
  Cán gáo chỉ gồm 2 phần nhìn thấy:
    1) P0 -> E1 : phần cán ở phía trước gáo
    2) I1 -> I2 : phần cán nằm trong lòng gáo

  Khoảng E1 -> I1 là phần cán nằm trong bề dày thành gáo
  và được che hoàn toàn bởi gáo.

  Không vẽ các ellipse/lỗ tối tại điểm xuyên thành:
  thành gáo tự tạo cảm giác cán đi xuyên qua khi hai lớp
  được xếp đúng thứ tự.

function luStickPath(g,A,B,roundEnd=false,cutStart=false,cutEnd=false){
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,w0=9,w1=7;

  // Phần cán trước gáo vẫn có đầu cắt phẳng tại A.
  // Phần cán trong gáo có thể bo tròn đầu B để giống cán thật.

  // bóng đổ phía dưới cán
  g.fillStyle='rgba(0,0,0,.30)';g.beginPath();
  g.moveTo(A[0]+nx*w0+8,A[1]+ny*w0+16);
  g.lineTo(B[0]+nx*w1+6,B[1]+ny*w1+14);
  g.lineTo(B[0]-nx*w1+6,B[1]-ny*w1+14);
  g.lineTo(A[0]-nx*w0+8,A[1]-ny*w0+16);
  g.closePath();g.fill();

  // thân cán — đầu A phẳng; đầu B có thể bo tròn
  const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
  const gr=g.createLinearGradient(mx-nx*9,my-ny*9,mx+nx*9,my+ny*9);
  gr.addColorStop(0,'#f2c690');
  gr.addColorStop(.45,'#d9924e');
  gr.addColorStop(1,'#9d5f2a');
  g.fillStyle=gr;g.beginPath();

  // Mép trên của cán tại A.
  const tx=dx/L, ty=dy/L;
  const cutDepth=5.5; // độ xéo của mặt cắt đầu A

  if(cutStart){
    // Mặt cắt xéo: hai góc đầu A lệch nhẹ theo trục cán,
    // để đầu cán ôm theo thành gáo thay vì cắt vuông góc.
    g.moveTo(
      A[0]+nx*w0+tx*cutDepth,
      A[1]+ny*w0+ty*cutDepth
    );
  }else{
    g.moveTo(A[0]+nx*w0,A[1]+ny*w0);
  }

  g.lineTo(B[0]+nx*w1,B[1]+ny*w1);

  if(roundEnd && !cutEnd){
    // Nửa cung tròn ở endpoint B.
    g.arc(B[0],B[1],w1,Math.atan2(ny,nx),Math.atan2(ny,nx)+Math.PI,true);
  }else if(cutEnd){
    // Mặt cắt xéo ở endpoint B theo hướng NGƯỢC với mặt cắt tại A.
    // Hai góc endpoint lệch theo trục cán theo chiều ngược lại,
    // tạo mặt cắt xéo đối ứng để fit với thành trong của gáo.
    g.lineTo(
      B[0]-nx*w1-tx*cutDepth,
      B[1]-ny*w1-ty*cutDepth
    );
  }else{
    g.lineTo(B[0]-nx*w1,B[1]-ny*w1);
  }

  if(cutStart){
    // Góc đối diện của mặt cắt xéo tại A.
    g.lineTo(
      A[0]-nx*w0-tx*cutDepth,
      A[1]-ny*w0-ty*cutDepth
    );
  }else{
    g.lineTo(A[0]-nx*w0,A[1]-ny*w0);
  }

  g.closePath();g.fill();

  // vân gỗ
  const R=mulberry32(77);g.lineCap='round';
  for(let k=0;k<30;k++){
    const o=(R()-.5)*1.7,a=R(),b=Math.min(1,a+.1+R()*.35);
    const A1=[lerp(A[0],B[0],a)+nx*w0*o*lerp(1,.78,a),lerp(A[1],B[1],a)+ny*w0*o*lerp(1,.78,a)];
    const B1=[lerp(A[0],B[0],b)+nx*w0*o*lerp(1,.78,b),lerp(A[1],B[1],b)+ny*w0*o*lerp(1,.78,b)];
    g.strokeStyle=R()<.5?'rgba(120,64,24,.35)':'rgba(255,226,170,.30)';
    g.lineWidth=.7+R()*.9;
    g.beginPath();g.moveTo(A1[0],A1[1]);g.lineTo(B1[0],B1[1]);g.stroke();
  }

  // highlight dọc cán
  g.strokeStyle='rgba(255,236,196,.55)';g.lineWidth=1.6;g.beginPath();
  g.moveTo(A[0]-nx*w0*.55,A[1]-ny*w0*.55);
  g.lineTo(B[0]-nx*w1*.55,B[1]-ny*w1*.55);g.stroke();
}

const COPY={"mo-dau": ["Xin gởi bạn những ký ức tuổi thơ *hồi đó* ở miền Tây vào những năm 2000.", "Hồi còn nhỏ, mỗi đứa như một tờ giấy trắng, được cuộc sống chấm lên đó những nét đầu tiên. Lúc lớn khôn, những nét chấm phá đó còn mãi vẹn nguyên, lâu lâu lại hiện về, đao đáo không nguôi. Tuổi thơ của con nít ngày đó phần nhiều gắn với sông nước và ruộng đồng. Thiếu nhiều tiện nghi so với bây giờ, nhưng bù lại, tụi tui như có nhiều thời gian hơn cho họ hàng chòm xóm.\n\nBao nhiêu năm đã trôi qua. Có những lúc, chỉ muốn lên một chuyến tàu ký ức, để thăm lại những ngày tháng mộc mạc đã xa lắm rồi!"], "den-dau": ["Hồi đó, những đêm cúp điện, mọi người thường xúm xít bên ánh *đèn dầu*.", "Nhớ mấy lần lấy cây nhang châm lửa cho đèn, lửa phựt lên, phía dưới màu xanh, phía trên màu vàng, mùi dầu phảng phất trong không khí. Tui nhìn hoài hông thấy chán. Trong nhà, người lớn ngồi lại nói chuyện, con nít ngồi học bài, muỗi thì bay vo ve. Ngoài đường vắng hơn, lâu lâu nghe tiếng rao của mấy đứa nhỏ bán bánh mì, của mấy cô chú bán bánh bao và chuối nếp nướng. Đâu đó, tiếng ễnh ương kêu um sùm, nghe quen tới mức hông mấy ai để ý."], "chuon-chuon": ["Rồi có những chiều ngoài bờ ruộng, mấy con *chuồn chuồn* bay thành đàn rồi đậu lên nhánh cây.", "Thấy chuồn chuồn đậu, có đứa con nít bước chậm tới, nín thở, chụm mấy ngón tay lại để chụp lấy đuôi con chuồn chuồn. Bắt nó để nhìn chơi, đôi khi để nó cắn, một hồi rồi thả. Người lớn thì nhìn chuồn chuồn mà đoán coi trời mưa nắng ra sao."], "chong-chong": ["Tui còn nhớ cái *chong chóng* được đan từ lá dừa.", "Cầm chạy ngược gió trên đường quê hoặc gắn lên xe đạp, chong chóng quay vù vù, nhìn thiệt đã mắt. Hông tốn đồng nào để mua, vậy mà chơi vui quá chừng."], "ca-la-dua": ["Cũng từ lá dừa, tụi tui học theo sách Thủ công để đan *con cá*.", "Mấy dải lá dừa đan chéo vô nhau, kéo tới kéo lui vậy mà thành hình con cá. Cá đan xong được gắn dây treo chơi đâu đó, có khi còn được thả xuống mương nước nữa."], "ban-dan": ["Mấy trò chơi hồi đó đông vui lắm, xôm tụ lắm. Thí dụ như trò *bắn đạn* được nhiều đứa chơi quài chơi quỷ.", "Tụi nó sưu tầm đủ thứ đạn: đạn mắt mèo, đạn mè, đạn sữa, ... Lúc chơi, một vòng tròn được vẽ trên sân đất, đặt mấy viên đạn vô giữa, rồi kẹp một viên trong mấy ngón tay mà búng cho trúng. Trúng viên nào là được lấy viên đó, thành ra túi quần đứa nào cũng lủng lẳng mấy viên đạn đủ kiểu, đi tới đi lui là nghe lốc cốc."], "dieu-giay": ["Tới mùa gió, con nít hay ra bờ ruộng chơi thả *diều giấy*.", "Diều làm bằng giấy tập cũ dán lên khung tre mỏng, rồi gắn thêm hai cái đuôi dài để lúc thả lên, đuôi bay phất phơ. Chỉ cần một cuộn chỉ, đứa nào cũng có thể ngồi thả diều cả buổi."], "an-ten": ["Chơi diều đã đời thì về nhà coi ti-vi. Hồi đó ti-vi bắt sóng bằng *ăng-ten* gắn trên cây cột cao bên hông nhà.", "Muốn coi đài nào, phải quay cái ăng-ten về hướng nhà đài. Hình mà bị hột, rè rè là ba chạy ra quay cây ăng-ten, trong nhà thì nói ra: “Còn hột ba ơi... Rồi, đó đó, hình trong rồi! Được rồi!”. Có khi quay hoài mà hình cũng không trong, nguyên nhà phải ngồi coi màn hình mờ mờ, đầy hột."], "thuyen-giay": ["Hôm trước ra bờ ruộng thì hôm sau ra bờ sông, con nít tụi tui thi thoảng xé giấy tập để xếp *thuyền giấy* rồi thả xuống sông.", "Thuyền bằng giấy mà gặp nước nên bơi không được lâu. Nước thấm vô làm giấy mềm nhũn, chiếc thuyền thành ra bèo nhèo, tè le hết trơn."], "nuoc-noi": ["Nói về nước thì khoảng tháng bảy, tháng tám âm lịch, nước đầu nguồn chảy về, nhiều cánh đồng và xóm làng bị ngập. Đó là *mùa nước nổi*.", "Người lớn bơi xuồng đi giăng lưới, đặt lọp bắt cá, hái bông điên điển về nấu ăn. Con nít thì có thêm chỗ để tập bơi, chống xuồng, câu cá."], "lu-nuoc": ["Ngày đó, hầu như nhà nào cũng có mấy *cái lu* hứng nước mưa, rồi gác thêm cái *gáo dừa* kế bên để múc nước.", "Nước từ mái nhà theo cái máng xối chảy xuống lu, thỉnh thoảng cũng cuốn theo vài miếng lá. Nước trong lu thường được lóng phèn cho bớt đục. Múc một gáo nước rửa mặt thật là mát lạnh."], "dong-ho": ["Có những món đồ mà đứa nhỏ nào cũng ước có được, trong đó có cái *đồng hồ Casio*.", "Casio F-91W là mẫu đồng hồ đeo tay kinh điển một thời, xài bền mà cũng không thấy hết pin. Đồng hồ có mặt đen, chữ vàng, có đèn để coi giờ trong tối, có báo thức kêu tít tít. Lần được ba mua cho cái đồng hồ, nhiều đêm tui nằm bấm đồng hồ cả buổi rồi mới ngủ."], "brick-game": ["Một món đồ khác mà con nít mê không thua gì đồng hồ Casio là cái máy chơi điện tử cầm tay, còn được kêu là *máy xếp gạch*.", "Máy có màn hình đen trắng, mấy cái nút vàng, trong đó có vô số trò chơi như xếp gạch, đua xe, bắn máy bay, rắn săn mồi. Mấy âm thanh bíp bíp với tiếng nhạc nền phát ra từ máy nghe hoài mà cũng thấy lôi cuốn."], "que-toi": ["Những ký ức trên gắn liền với một nơi quen thuộc, *quê hương*.", "Tui lớn lên ở một xóm nhỏ bên dòng Cửu Long, với nhiều kênh rạch chằn chịt.\n\nNhững chuyến đò chèo, những đám cưới rước dâu bằng tắc-ráng, những nhà thương, bến chợ nằm bên sông... tất cả đều là hình ảnh quen thuộc. Rồi những câu vọng cổ, tiếng trống đình, tiếng chuông chùa hay chuông xóm đạo — mỗi thứ một âm thanh, vậy mà góp lại thành một phần của *hồi đó*.\n\nKho báu của tuổi thơ đâu phải là tiền bạc, mà là những hình ảnh, những âm thanh, và những con người chân chất xuất hiện mỗi ngày quanh một đứa nhỏ."]};

/* ---------- small helpers ---------- */
function vCat(P,u){const n=P.length-1,f=clamp(u)*n,i=Math.min(n-1,Math.floor(f)),t=f-i;const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n,i+2)];
  const t2=t*t,t3=t2*t,a=-.5*t3+t2-.5*t,b=1.5*t3-2.5*t2+1,c=-1.5*t3+2*t2+.5*t,d=.5*t3-.5*t2;return[p0[0]*a+p1[0]*b+p2[0]*c+p3[0]*d,p0[1]*a+p1[1]*b+p2[1]*c+p3[1]*d]}
function vAng(P,u){const a=vCat(P,Math.max(0,u-.004)),b=vCat(P,Math.min(1,u+.004));return Math.atan2(b[1]-a[1],b[0]-a[0])}
const ss01=(a,b,x)=>ease(inv(a,b,x));
function hexA(h,a){h=h.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`}
function vLeaf(g,x,y,rot,s,col){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle=col;g.strokeStyle='rgba(40,50,20,.75)';g.lineWidth=.9/s*1.2;
  g.beginPath();g.moveTo(-11,0);g.quadraticCurveTo(-3,-6,11,0);g.quadraticCurveTo(-3,6,-11,0);g.fill();g.stroke();
  g.strokeStyle='rgba(40,70,20,.5)';g.beginPath();g.moveTo(-11,0);g.lineTo(11,0);g.stroke();g.restore()}

/* ---------- đèn dầu: luồng gió nhẹ làm ngọn lửa phập phồng ---------- */
function VDRAFT(u){const d=noise1(u*.32,77),e=noise1(u*.9,78),gs=Math.pow(clamp((noise1(u*.17,79)-.42)*2.6),1.4);
  return{k:.9+.12*d+.05*e-.13*gs*(.55+.45*Math.sin(u*7.3)),tip:(d-.5)*7+gs*10*Math.sin(u*3.1)}}

/* ---------- chong chóng: gió lúc mạnh lúc yếu ---------- */
const VPIN=(()=>{const K=[[0,.06],[1.6,.95],[3.2,1.05],[4.6,.55],[6.0,.28],[7.4,.85],[8.8,1.3],[10.2,1.15],[11.4,.5],[12.6,.3],[13.8,.8],[15.2,1.05],[18,1]];
  const wind=u=>{u=clamp(u,0,17.99);let i=1;while(K[i][0]<u)i++;const a=K[i-1],b=K[i],f=(u-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],(1-Math.cos(Math.PI*f))/2)*(1+.08*(noise1(u*2.3,61)-.5))};
  const om=u=>.1+1.55*wind(u);
  const dt=.005,N=Math.ceil(18/dt),TH=new Float64Array(N+1),WD=new Float64Array(N+1);
  for(let i=1;i<=N;i++){const u=(i-.5)*dt;TH[i]=TH[i-1]+om(u)*dt;WD[i]=WD[i-1]+wind(u)*dt}
  const look=(A,u)=>{u=clamp(u,0,17.99);const f=u/dt,i=Math.min(N-1,Math.floor(f));return lerp(A[i],A[i+1],f-i)};
  return{wind,om,th:u=>look(TH,u)*TAU,dist:u=>look(WD,u)}})();

/* ---------- máy xếp gạch: tự chơi (tính sẵn từng khung 1/60 s) ---------- */
const VNP={I:[[0,0],[0,1],[0,2],[0,3]],O:[[0,0],[0,1],[1,0],[1,1]],T:[[0,0],[0,1],[0,2],[1,1]],L:[[0,0],[1,0],[2,0],[2,1]],J:[[0,1],[1,1],[2,1],[2,0]],S:[[0,1],[0,2],[1,0],[1,1]],Z:[[0,0],[0,1],[1,1],[1,2]]};
const VTET=(()=>{const FPS=60,END=24,dt=1/FPS;
  const norm=c=>{const mr=Math.min(...c.map(q=>q[0])),mc=Math.min(...c.map(q=>q[1]));return c.map(q=>[q[0]-mr,q[1]-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
  const ROTS={};for(const k in VNP){const L=[];let c=VNP[k];for(let i=0;i<4;i++){const n=norm(c),key=JSON.stringify(n);if(!L.some(x=>x.key===key))L.push({key,c:n});c=c.map(([r,cc])=>[cc,-r])}ROTS[k]=L.map(x=>x.c)}
  let B=ROWS0.map(r=>r.split('').map(ch=>ch==='#'?1:0));
  const fits=(cells,r,c)=>cells.every(([a,b])=>{const R=r+a,C=c+b;return C>=0&&C<10&&R<20&&(R<0||!B[R][C])});
  const wid=cells=>Math.max(...cells.map(q=>q[1]))+1;
  function evalPlace(cells,c){if(!fits(cells,0,c))return null;let r=0;while(fits(cells,r+1,c))r++;
    const b=B.map(x=>x.slice());for(const[a,bb]of cells)b[r+a][c+bb]=1;
    let lines=0;const keep=[];for(const row of b){if(row.every(v=>v))lines++;else keep.push(row)}while(keep.length<20)keep.unshift(Array(10).fill(0));
    let agg=0,bump=0,holes=0,prev=0;for(let k=0;k<10;k++){let top=20;for(let rr=0;rr<20;rr++)if(keep[rr][k]){top=rr;break}const h=20-top;agg+=h;if(k)bump+=Math.abs(h-prev);prev=h;for(let rr=top+1;rr<20;rr++)if(!keep[rr][k])holes++}
    return -.51*agg+1.05*lines-.36*holes-.18*bump}
  function choose(p){let best=null;ROTS[p].forEach((cells,ri)=>{for(let c=0;c<=10-wid(cells);c++){const s=evalPlace(cells,c);if(s!==null&&(!best||s>best.s))best={ri,c,s}}});return best}
  const R=mulberry32(2026),SEQ=['I'];while(SEQ.length<60){const p='IOTLJSZ'[Math.floor(R()*7)];if(p!==SEQ[SEQ.length-1])SEQ.push(p)}
  const SN=[],EV=[];let score=120,shown=120,cur=null,qi=0,press=null,pressUntil=0,flash=null,spawnAt=.5;
  const doPress=(t,p,d=.11)=>{press=p;pressUntil=t+d};
  for(let i=0;i<=END*FPS;i++){const t=i*dt;
    if(t>=.15&&t<.15+dt)doPress(t,'start',.15);
    if(!cur&&!flash&&spawnAt!==null&&t>=spawnAt){const p=SEQ[qi++];const pl=choose(p);cur={p,ri:0,cells:ROTS[p][0],r:0,c:3,tr:pl?pl.ri:0,tc:pl?pl.c:3,act:t+.3,grav:t+.5,drop:false,nd:0};
      cur.c=Math.min(cur.c,10-wid(cur.cells));spawnAt=null;EV.push({t,k:'spawn'})}
    if(cur){const C=cur;let lock=false;
      if(!C.drop&&t>=C.act){
        if(C.ri!==C.tr){const nc=ROTS[C.p][C.ri+1],c2=Math.min(C.c,10-wid(nc));if(fits(nc,C.r,c2)){C.ri++;C.cells=nc;C.c=c2;doPress(t,'rot');EV.push({t,k:'rot'})}else C.tr=C.ri;C.act=t+.17}
        else if(C.c!==C.tc){const d=Math.sign(C.tc-C.c);if(fits(C.cells,C.r,C.c+d)){C.c+=d;doPress(t,d<0?'left':'right');EV.push({t,k:'move'})}else C.tc=C.c;C.act=t+.13}
        else{C.drop=true;C.nd=t+.1;doPress(t,'down',.2);EV.push({t,k:'drop'})}}
      if(C.drop){if(t>=C.nd){if(fits(C.cells,C.r+1,C.c)){C.r++;C.nd=t+.028}else lock=true}}
      else if(t>=C.grav){if(fits(C.cells,C.r+1,C.c)){C.r++;C.grav=t+.36}else lock=true}
      if(lock){for(const[a,b]of C.cells)if(C.r+a>=0)B[C.r+a][C.c+b]=1;cur=null;EV.push({t,k:'lock'});
        const rows=[];B.forEach((row,ri)=>{if(row.every(v=>v))rows.push(ri)});
        if(rows.length){flash={rows,t0:t};EV.push({t,k:'clear',n:rows.length})}else spawnAt=t+.18}}
    if(flash&&t-flash.t0>=.45){const keep=B.filter((row,ri)=>!flash.rows.includes(ri));while(keep.length<20)keep.unshift(Array(10).fill(0));B=keep;score+=[0,100,300,500,800][flash.rows.length];flash=null;spawnAt=t+.15}
    shown+=(score-shown)*.16;
    const piece=cur?cur.cells.map(([a,b])=>[cur.r+a,cur.c+b]):[];
    SN.push({on:t>=.15,test:t>=.15&&t<.45,board:B.map(r=>r.map(v=>v?'#':'.').join('')),piece,score:Math.round(shown),next:SEQ[cur?qi:qi]||'T',
      flash:flash&&Math.floor((t-flash.t0)/.1)%2===0?flash.rows:null,press:t<pressUntil?press:null})}
  return{state:u=>SN[Math.max(0,Math.min(SN.length-1,Math.round(u*FPS)))],EV}})();

/* ---------- bắn đạn: lần đầu (bi xanh) hụt, lần sau (bi đỏ) trúng ---------- */
const VMB=(()=>{const R=MR,A0=[270,400],C0=[160,540],D0=[370,600];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],len=v=>Math.hypot(v[0],v[1]),nrm=v=>{const l=len(v);return[v[0]/l,v[1]/l]};
  const S1=[1050,1150],E1=[280,210],d1=nrm(sub(E1,S1)),L1=len(sub(E1,S1)),a1=260,v1=Math.sqrt(2*a1*L1),t1=3.4,dur1=v1/a1;
  const na=189*Math.PI/180,phi=28*Math.PI/180,n=[Math.cos(na),Math.sin(na)],d=[n[0]*Math.cos(phi)-n[1]*Math.sin(phi),n[0]*Math.sin(phi)+n[1]*Math.cos(phi)];
  const Cc=[A0[0]-2*R*n[0],A0[1]-2*R*n[1]],L2=900,S2=[Cc[0]-d[0]*L2,Cc[1]-d[1]*L2],t2=13.6,Tm=1.6,a=150,v0=(L2+.5*a*Tm*Tm)/Tm,vI=v0-a*Tm,hit=t2+Tm;
  const dn=d[0]*n[0]+d[1]*n[1],p=nrm([d[0]-dn*n[0],d[1]-dn*n[1]]),vA=vI*Math.cos(phi),vB=vI*Math.sin(phi),a2=240;
  const slide=(v,ac,t)=>{const ts=v/ac,tt=Math.min(t,ts);return v*tt-.5*ac*tt*tt};

function moDau(g,T,s){const C=[516,540],cols=[[217,141,121],[123,205,232],[232,184,98]];
  for(let k=0;k<11;k++){const x=ihash(k*7+1)*VW,y=((ihash(k*5+2)*VH-T*(6+k))%VH+VH)%VH,r=24+ihash(k*3)*70,a=(.05+.06*Math.sin(T*.5+k))*ease(inv(0,3,T));const cc=cols[k%3];
    const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${cc},${a*1.4})`);rg.addColorStop(1,`rgba(${cc},0)`);g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
  for(let k=0;k<14;k++){const b=.6+k*2.4,age=T-b;if(age<0||age>10.5)continue;const r=60+age*118,a=.22*Math.pow(1-age/10.5,1.5)*ease(clamp(age/.9)),cc=cols[k%3];
    const rg=g.createRadialGradient(C[0],C[1],r*.72,C[0],C[1],r);rg.addColorStop(0,`rgba(${cc},0)`);rg.addColorStop(1,`rgba(${cc},${a*.55})`);g.fillStyle=rg;g.beginPath();g.arc(C[0],C[1],r,0,TAU);g.fill();
    g.strokeStyle=`rgba(${cc},${a})`;g.lineWidth=2.2;g.beginPath();g.arc(C[0],C[1],r,0,TAU);g.stroke()}
  if(!IMG.complete||!IMG.naturalWidth)return;
  const IH=790,IWd=IH*IMG.naturalWidth/IMG.naturalHeight,bl=lerp(26,0,ease(inv(0,4.8,T))),al=ease(inv(-.3,2.4,T));
  const z=1+.12*eio(inv(3.5,30,T)),dx=16*Math.sin(T*.19)-30*eio(inv(3.5,30,T)),dy=12*Math.sin(T*.23+1)-40*eio(inv(3.5,30,T)),rt=.016*Math.sin(T*.16);
  g.save();g.translate(C[0],C[1]);g.translate(dx,dy);g.rotate(rt);g.scale(z,z);

  g.globalCompositeOperation='lighter';g.globalAlpha=al*.35*fl;const fx=IWd*(447/785-.5),fy=IH*(820/1409-.5),rg=g.createRadialGradient(fx,fy,0,fx,fy,110);rg.addColorStop(0,'rgba(255,190,90,.8)');rg.addColorStop(1,'rgba(255,150,60,0)');g.fillStyle=rg;g.beginPath();g.arc(fx,fy,110,0,TAU);g.fill();
  g.restore()}

function denDauOver(g,T,s){const u=8.3+Math.max(0,T),m=figMap(s),z=lerp(1.09,1.16,ease(inv(0,40,u))),L=m.pt([270,560+(470-560)*z]);

  const pos=(M,x)=>{const a=x*M.w[0]+M.sd,b=x*M.w[1]+M.sd*2;return[L[0]+M.R[0]*Math.sin(a)+80*(noise1(x*.8,M.sd)-.5)*2,L[1]+40+M.R[1]*Math.sin(b)+50*(noise1(x*.9,M.sd+1)-.5)*2]};
  for(const M of MOSQ){if(T<M.t0)continue;const q=ease(clamp((T-M.t0)/2.2));const st=[L[0]+(M.sd%2?1:-1)*1300,L[1]-500+M.sd*20];

function chuonOver(g,T,s){const u=T+.3,A=SC('02-chuon-chuon').at,m=figMap(s),P=MH.P;P.setBoil(u);
  const perch=m.pt(MH.ST.perch),sc=2.0*MH.ST.z*m.k,gu=MH.ST.gust;
  // teal: far, wanders across the whole frame
  if(u>3&&u<20){const wp=x=>[900+640*Math.sin(.23*x+.4)+170*Math.sin(.61*x+1.3),500+250*Math.sin(.31*x+2)+90*Math.sin(.83*x)];
    const qi=ease(inv(3,5.2,u)),qo=ease(inv(17.4,20,u));let p=wp(u),p2=wp(u+.03);const a0=[-180,1180],a1=[2150,-160];
    p=[lerp(lerp(a0[0],p[0],qi),a1[0],qo),lerp(lerp(a0[1],p[1],qi),a1[1],qo)];p2=[lerp(lerp(a0[0],p2[0],qi),a1[0],qo),lerp(lerp(a0[1],p2[1],qi),a1[1],qo)];
    P.dragonfly(g,p[0],p[1],1.65,Math.atan2(p2[1]-p[1],p2[0]-p[0]),1,u+1.7,P.DFP.teal)}
  const flicks=(L,list)=>{let f=Math.max(0,1-(u-L)/.2);for(const x of list)f+=ss01(x,x+.05,u)*(1-ss01(x+.12,x+.18,u))*.8;return f+gu*.45*(.5+.5*Math.sin(u*11))};
  // red
  if(u>=A.fly&&u<A.take+2.8){let p,a,fl=1;
    if(u<A.land){const path=[[-120,210],[40,250],[170,330],[300,380],[330,420]].map(m.pt);path.push(perch);const q=ss01(A.fly,A.land,u);p=vCat(path,q);p[1]+=Math.sin(u*9)*5*(1-q);a=vAng(path,q)*.35}
    else if(u<A.take){p=perch;a=-.06+.015*Math.sin(u*.8)+gu*.05*Math.sin(u*2.6);fl=flicks(A.land,A.flick)}
    else{const path=[perch,[perch[0]+40,perch[1]-90],[1000,210],[1550,-10],[1900,-220]],q=ease(inv(A.take,A.take+2.8,u));p=vCat(path,q);a=lerp(-.06,vAng(path,q),ss01(0,.08,q))}
    P.dragonfly(g,p[0],p[1],sc,a,fl,u,P.DFP.red)}
  // orange
  if(u>=A.fly2){let p,a,fl=1;
    if(u<A.land2){const path=[[2120,300],[1500,170],[900,250],[560,400],[perch[0]-170,perch[1]-30],perch],q=ss01(A.fly2,A.land2,u);p=vCat(path,q);p[1]+=Math.sin(u*8)*5*(1-q);a=lerp(vAng(path,q),-.06,ss01(.9,1,q))}
    else{p=perch;a=-.06+.015*Math.sin(u*.8)+gu*.05*Math.sin(u*2.6);fl=flicks(A.land2,A.flick2)}
    P.dragonfly(g,p[0],p[1],sc,a,fl,u,P.DFP.orange)}}

function kiteDraw(g,T,s){const t=T+20,P=MH.P;P.setBoil(t);
  let gr=g.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#77b2d6');gr.addColorStop(.55,'#86c3dd');gr.addColorStop(1,'#e8f3e2');g.fillStyle=gr;g.fillRect(0,0,VW,VH);

  for(let i=0;i<7;i++)cl(i);
  for(const F of FLOCK){const q=T-F.t0;if(q<0||q>8)continue;const lx=F.dir<0?VW+160-q*330:-160+q*330;
    for(let j=0;j<F.n;j++){const rk=Math.ceil(j/2),sd=j%2?1:-1;P.bird(g,lx-F.dir*rk*48+6*Math.sin(t*.7+j),F.y+sd*rk*24+rk*8+5*Math.sin(t*1.3+j),2.0-rk*.08,t*9+j*1.3)}}

  for(let k=0;k<6;k++){const sp=240+ihash(k,3)*120,span=VW+800,x=((T*sp*1.6+ihash(k,1)*2000)%span)-200,y=120+k*160+ihash(k,2)*60;
    P.windStreak(g,x,y,380+ihash(k,4)*240,14+ihash(k,5)*10,k*1.7+T*2,.55,3.2,k%2?0:16+ihash(k,6)*8)}
  // kite: wanders slowly, near (big, low) and far (small, high)
  const kp=x=>{const d=.5+.36*Math.sin(x*.42+.4)+.14*Math.sin(x*.95+1.1);return{d,x:clamp(540+250*Math.sin(x*.23+.5)+70*Math.sin(x*.61+2),220,860),y:lerp(190,470,d)+70*Math.sin(x*.37+1)+18*Math.sin(x*1.3)}};
  const K0=kp(T),K1=kp(T+.05),ks=lerp(1.8,3.7,K0.d),vx=(K1.x-K0.x)/.05;
  const ka=Math.sin(t*1.1)*.13+.16+.1*gust+clamp(vx*.002,-.25,.25);
  const br=[K0.x-Math.sin(ka)*4*ks,K0.y+Math.cos(ka)*4*ks],Hh=[140,1230],mid=[(Hh[0]+br[0])/2,(Hh[1]+br[1])/2],ctl=[mid[0]+70+gust*24,mid[1]+150*(1-K0.d*.3)];
  const pts=[];for(let i=0;i<=30;i++){const k=i/30;pts.push([(1-k)*(1-k)*Hh[0]+2*(1-k)*k*ctl[0]+k*k*br[0],(1-k)*(1-k)*Hh[1]+2*(1-k)*k*ctl[1]+k*k*br[1]+Math.sin(k*Math.PI)*Math.sin(t*23)*1.6])}
  P.wobbleLine(g,pts,{w:1.6,col:'rgba(40,28,20,.85)',seed:820,amp:.3});
  P.kite(g,K0.x,K0.y,ks,ka,t*(1+gust*.35));
  for(let i=7;i<10;i++)cl(i);
  for(let k=0;k<4;k++){const sp=360+ihash(k,13)*160,span=VW+900,x=((T*sp*1.8+ihash(k,11)*2000)%span)-250,y=200+k*230+ihash(k,12)*80;
    P.windStreak(g,x,y,460+ihash(k,14)*240,16+ihash(k,15)*10,k*2.3+T*2.6,.8,4.6,k%2?20:0)}
  for(let k=0;k<6;k++){const b=k*3.3-1,q=T-b;if(q<0||q>7)continue;const x=-80+q*(300+k*30),y=280+(k*173)%560+60*Math.sin(q*1.6+k);
    vLeaf(g,x,y,q*(4+k*.6)+k,2.1,k%2?'#7fae45':'#9cc15a')}}

function boatDraw(g,T,s){const u=Math.max(0,T),P=MH.P;P.setBoil(u);
  g.fillStyle=s.bg;g.fillRect(0,0,VW,VH);
  g.lineCap='round';for(let k=0;k<34;k++){const y=ihash(k*3)*VH,x=((ihash(k*5)*VW+u*(6+ihash(k)*10))%(VW+300))-150,L=60+ihash(k*7)*160;
    g.strokeStyle=k%3?`rgba(255,250,235,${.035+.03*Math.sin(u*1.1+k)})`:'rgba(18,40,44,.10)';g.lineWidth=2+ihash(k*9)*3;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+L/2,y-4,x+L,y+1);g.stroke()}
  for(let k=0;k<7;k++){const x=((ihash(k,1)*VW+u*(8+k*2))%VW),y=120+ihash(k,2)*860,tw=Math.max(0,Math.sin(u*1.3+ihash(k,3)*9));if(tw<.1)continue;
    g.save();g.translate(x,y);g.scale(3.2,.7);glow(g,0,0,26+ihash(k,4)*16,'rgba(255,250,230,A)',.14*tw);g.restore()}
  // leaf
  {const q=clamp(u/16),p=vCat(LPH,q),f=1.45;g.save();g.translate(p[0],p[1]+3*Math.sin(u*1.8));g.rotate(.4+Math.sin(u)*.1+q*1.4);g.scale(f,f);
    for(let k=0;k<2;k++){const r=((u*.4+k/2)%1)*40+20;g.strokeStyle=`rgba(255,245,220,${.25*(1-((u*.4+k/2)%1))})`;g.lineWidth=1;g.beginPath();g.ellipse(0,4,r,r*.3,0,0,TAU);g.stroke()}
    P.wobbleShape(g,[[-22,0],[-6,-8],[18,-4],[24,0],[18,5],[-6,8]],{fill:'#7fae45',seed:960,amp:.4,w:1.1});P.wobbleLine(g,[[-22,0],[24,0]],{w:.7,col:'rgba(40,70,20,.5)',seed:961,straight:true});g.restore()}
  // boat
  const q=ease(clamp(u/16))*.85+clamp(u/16)*.15,p=vCat(BP,q),p2=vCat(BP,Math.min(1,q+.004)),s0=3.0,f=s0/2.2;
  const bx=p[0],by=p[1]+Math.sin(u*2.2)*4,ang=Math.sin(u*2.1)*.05;
  const vx=p2[0]-p[0],vy=p2[1]-p[1],vl=Math.hypot(vx,vy)||1;
  g.strokeStyle='rgba(255,245,220,.22)';g.lineWidth=1.6;for(let i=0;i<3;i++){const L=(90+i*55)*f,sp=(26+i*16)*f;for(const sd of[-1,1]){g.beginPath();g.moveTo(bx-vx/vl*30*f,by+12*f);g.lineTo(bx-vx/vl*L-vy/vl*sp*sd,by+12*f-vy/vl*L*.3+vx/vl*sp*sd*.25);g.stroke()}}
  for(let k=0;k<3;k++){const r=((u*.55+k/3)%1),rr=(36+r*110)*f;g.strokeStyle=`rgba(255,245,220,${.45*(1-r)})`;g.lineWidth=1.6;g.beginPath();g.ellipse(bx,by+12*f,rr,rr*.22,0,0,TAU);g.stroke()}
  g.save();g.beginPath();g.rect(0,by+8*f,VW,400);g.clip();g.globalAlpha=.26;g.translate(0,by*2+22*f);g.scale(1,-1);P.paperBoat(g,bx,by,s0,0,901);g.restore();
  P.paperBoat(g,bx,by,s0,ang,900);
  g.fillStyle='rgba(16,38,40,.30)';g.fillRect(bx-72*f,by+9*f,144*f,5*f)}

  if(s.mode==='credit'){creditDraw(g,T);return}

  if(s.under){g.save();s.under(g,T,s);g.restore()}

    if(s.over){g.save();s.over(g,T,s);g.restore()}

  if(TEXTMODE==='full')vDrawCopy(g,s,T);else if(TEXTMODE==='topic')vDrawTopic(g,s,T)}

  if(B){drawSection(LAYER.g,B,t-B.start);g.setTransform(1,0,0,1,0,0);g.globalAlpha=ease(clamp(a));g.drawImage(LAYER.c,0,0);g.globalAlpha=1}}

  'que-toi':[{text:'Kho báu của tuổi thơ đâu phải là tiền bạc, mà là những hình ảnh, những âm thanh, và những con người chân chất xuất hiện mỗi ngày quanh một đứa nhỏ.',sz:40,t0:20}]};
const tFont=(sz,kw)=>kw?`italic 600 ${(sz*1.32).toFixed(1)}px 'Lora',Georgia,serif`:`${sz>=36?400:300} ${sz}px 'Be Vietnam Pro','Segoe UI',system-ui,sans-serif`;
function vBuildTopic(s){if(!COPY[s.id])return;
  const lead=COPY[s.id][0],blocks=[{text:lead,sz:lead.length>110?42:47,t0:0}];
  for(const e of TOPIC_EXTRA[s.id]||[])blocks.push(Object.assign({},e));
  if(s.id==='que-toi')blocks[0].t1=18.6;
  const MAXW=s.id==='mo-dau'?700:720;
  for(const b of blocks){const sz=b.sz,LHh=sz*1.5,words=vParse(b.text).filter(w=>!w.br);
    MC.font=tFont(sz,false);const sp=MC.measureText(' ').width,m=MC.measureText('Hgĩ'),asc=m.fontBoundingBoxAscent||sz,des=m.fontBoundingBoxDescent||sz*.3;
    for(const w of words){w.w=0;for(const r of w.runs){MC.font=tFont(sz,r.kw);r.w=MC.measureText(r.s).width;w.w+=r.w}w.kw=w.runs.some(r=>r.kw)}
    const wrap=W0=>{const L=[];let ln=[],lw=0;for(const w of words){const need=ln.length?lw+sp+w.w:w.w;if(need>W0&&ln.length){L.push(ln);ln=[w];lw=w.w}else{ln.push(w);lw=need}}L.push(ln);return L};
    const n0=wrap(MAXW).length;let lo=MAXW*.4,hi=MAXW;for(let k=0;k<22;k++){const mid=(lo+hi)/2;if(wrap(mid).length>n0)lo=mid;else hi=mid}
    const lines=wrap(hi+1);b.w=0;b.h=lines.length*LHh;b.words=[];const pad=40;
    lines.forEach((ln,li)=>{let x=0;const y=li*LHh+LHh/2+(asc-des)/2;for(const w of ln){
      const c=document.createElement('canvas');c.width=Math.ceil((w.w+2*pad)*OS);c.height=Math.ceil((asc+des+sz*.6+2*pad)*OS);const g=c.getContext('2d');g.setTransform(OS,0,0,OS,0,0);g.textBaseline='alphabetic';
      for(const sh of(s.tsh&&s.tsh.length?s.tsh:[null])){g.shadowColor=sh?sh[3]:'transparent';g.shadowOffsetX=sh?sh[0]*OS:0;g.shadowOffsetY=sh?sh[1]*OS:0;g.shadowBlur=sh?sh[2]*OS:0;
        let xx=pad;for(const r of w.runs){g.font=tFont(sz,r.kw);g.fillStyle=r.kw?s.kw:(b.soft?s.soft:s.fg);g.fillText(r.s,xx,pad+asc+sz*.3);xx+=r.w}}
      b.words.push({c,x,y,w:w.w,kw:w.kw,pad,oy:pad+asc+sz*.3});x+=w.w+sp}b.w=Math.max(b.w,x-sp)})}
  // placement: centred in the text column; stacked blocks are placed together
  const colC=s.flip?516:1404,groups=[];for(const b of blocks){if(b.stack&&groups.length)groups[groups.length-1].push(b);else groups.push([b])}
  for(const G of groups){const gap=34,H=G.reduce((a,b)=>a+b.h,0)+gap*(G.length-1),Wm=Math.max(...G.map(b=>b.w));let y=VH*.49-H/2;
    for(const b of G){b.x=colC-Wm/2;b.y=y;y+=b.h+gap}}
  s.tblocks=blocks}
function vDrawTopic(g,s,T){if(!s.tblocks)return;const dir=s.flip?1:-1;
  for(const b of s.tblocks){const fo=b.t1!=null?1-ease(inv(b.t1,b.t1+1,T)):1;if(fo<=0||T<b.t0)continue;const n=b.words.length,stg=Math.min(.085,2.4/n);
    b.words.forEach((w,i)=>{const st=b.t0+.35+i*stg,a=ease(inv(st,st+1.1,T))*fo;if(a<=0)return;
      const e=eout(inv(st,st+1.4,T)),wv=ease(inv(st+1.1,st+3.5,T));
      // after appearing: a slow wave runs through the words, keywords breathe (stretch) very gently
      const dy=(1-e)*18+wv*(2.6*Math.sin(TAU*T/7.5-i*.42)),dx=(1-e)*dir*10+wv*1.1*Math.sin(TAU*T/11+i*.9);
      const k=w.kw?.03*Math.sin(TAU*T/6.2+i*.6):.008*Math.sin(TAU*T/8.5+i*.5),sx=1+wv*k,sy=1-wv*k*.5;
      g.globalAlpha=a;g.save();g.translate(b.x+w.x+w.w/2+dx,b.y+w.y+dy);g.scale(sx,sy);g.drawImage(w.c,-w.w/2-w.pad,-w.oy,w.c.width/OS,w.c.height/OS);g.restore()})}
  g.globalAlpha=1}


/* ════════════ AUDIO: nhạc nền (đàn tranh + sáo, ngũ cung Sol) & hiệu ứng ════════════

   khi xuất file (OfflineAudioContext) thì dựng hết một lần.  stem:'sfx' = chỉ hiệu ứng. */

const midi=n=>440*Math.pow(2,(n-69)/12);
const ACACHE=new WeakMap();

  const END=opt.end??VDUR,fs=Math.max(from,END-.6);master.gain.setValueAtTime(1,T(fs));master.gain.linearRampToValueAtTime(0,T(END));
  const noMusic=opt.stem==='sfx';

async function renderAudioBuffer(opt,a=0,b=VDUR){const sr=48000,oac=new OfflineAudioContext(2,Math.ceil(sr*(b-a)),sr);buildAudio(oac,oac.destination,a,0,Object.assign({end:b},opt));return oac.startRendering()}
function wav16(buf){const nc=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate,ab=new ArrayBuffer(44+len*nc*2),v=new DataView(ab);let o=0;
  const ws=s=>{for(const c of s)v.setUint8(o++,c.charCodeAt(0))};ws('RIFF');v.setUint32(o,36+len*nc*2,true);o+=4;ws('WAVEfmt ');v.setUint32(o,16,true);o+=4;v.setUint16(o,1,true);o+=2;v.setUint16(o,nc,true);o+=2;
  v.setUint32(o,sr,true);o+=4;v.setUint32(o,sr*nc*2,true);o+=4;v.setUint16(o,nc*2,true);o+=2;v.setUint16(o,16,true);o+=2;ws('data');v.setUint32(o,len*nc*2,true);o+=4;
  const ch=[];for(let c=0;c<nc;c++)ch.push(buf.getChannelData(c));for(let i=0;i<len;i++)for(let c=0;c<nc;c++){const x=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return ab}
async function renderAudioWavB64(stem){const b=await renderAudioBuffer({music:stem!=='sfx',stem});const u8=new Uint8Array(wav16(b));let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}

/* ---- MP4 export: frame-accurate with WebCodecs (faster than real time on most machines); real-time recording as a fallback ---- */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
const busy=m=>{const b=$('busy');if(m==null){b.hidden=true}else{b.hidden=false;b.textContent=m}};
let CANCEL=false;
async function exportMP4(){
  if(EXPORTING){CANCEL=true;return}
  pause();EXPORTING=true;CANCEL=false;const btn=$('mp4');btn.classList.add('on');btn.textContent='■ Hủy';$('play').disabled=true;seek.disabled=true;$('start').hidden=true;
  try{
    if(window.VideoEncoder&&window.AudioEncoder&&window.Mp4Muxer){await exportWebCodecs()}
    else await exportRealtime();
  }catch(e){console.error(e);if(!CANCEL){try{await exportRealtime()}catch(e2){alert('Không xuất được MP4 trên trình duyệt này: '+e2.message)}}}
  finally{EXPORTING=false;btn.classList.remove('on');btn.textContent='⬇ MP4';$('play').disabled=false;seek.disabled=false;busy(null);draw()}}
async function exportWebCodecs(){const FPS=30,Wd=cv.width,Hd=cv.height,N=Math.ceil((VRB-VRA)*FPS);
  const vcodecs=['avc1.640028','avc1.4d0028','avc1.42002a','avc1.42001f'];let vcfg=null;
  for(const c of vcodecs){const cfg={codec:c,width:Wd,height:Hd,bitrate:12e6,framerate:FPS,avc:{format:'avc'}};try{if((await VideoEncoder.isConfigSupported(cfg)).supported){vcfg=cfg;break}}catch(e){}}
  if(!vcfg)throw new Error('H.264 encoder unavailable');
  let acfg=null,acod=null;for(const[c,m]of[['mp4a.40.2','aac'],['opus','opus']]){const cfg={codec:c,sampleRate:48000,numberOfChannels:2,bitrate:192000};try{if((await AudioEncoder.isConfigSupported(cfg)).supported){acfg=cfg;acod=m;break}}catch(e){}}
  busy('Đang dựng âm thanh…');const abuf=await renderAudioBuffer({music:musicOn},VRA,VRB);
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:Wd,height:Hd,frameRate:FPS},audio:acfg?{codec:acod,numberOfChannels:2,sampleRate:48000}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let err=null;const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});venc.configure(vcfg);
  if(acfg){const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>err=e});aenc.configure(acfg);
    const L=abuf.getChannelData(0),R=abuf.getChannelData(1),CH=4800;
    for(let i=0;i<abuf.length;i+=CH){const n=Math.min(CH,abuf.length-i),d=new Float32Array(n*2);d.set(L.subarray(i,i+n),0);d.set(R.subarray(i,i+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/48000*1e6),data:d});aenc.encode(ad);ad.close()}
    await aenc.flush();aenc.close()}
  const tStart=performance.now();
  for(let i=0;i<N;i++){if(CANCEL)throw new Error('cancelled');if(err)throw err;
    render(VRA+i/FPS);const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});venc.encode(vf,{keyFrame:i%60===0});vf.close();
    if(venc.encodeQueueSize>6)await new Promise(r=>{const w=()=>venc.encodeQueueSize>2?setTimeout(w,4):r();w()});
    if(i%10===0){const el=(performance.now()-tStart)/1000,eta=el/(i+1)*(N-i-1);busy(`Đang xuất MP4… ${Math.round(i/N*100)}%  (còn ~${fmt(eta)})`);await new Promise(r=>setTimeout(r,0))}}
  await venc.flush();venc.close();muxer.finalize();
  download(new Blob([muxer.target.buffer],{type:'video/mp4'}),fileName('mp4'))}
async function exportRealtime(){if(!window.MediaRecorder)throw new Error('MediaRecorder unavailable');
  const list=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mime=list.find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw new Error('no recorder format');
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();await AC.resume();const dest=AC.createMediaStreamDestination();
  const st=cv.captureStream(30);for(const tr of dest.stream.getAudioTracks())st.addTrack(tr);
  const chunks=[],rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:10e6,audioBitsPerSecond:192e3});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);t=VRA;const a=buildAudio(AC,dest,VRA,AC.currentTime+.1,{music:musicOn,end:VRB});const c0r=AC.currentTime+.1;rec.start(1000);
  await new Promise(res=>{const step=()=>{if(CANCEL){res();return}const x=AC.currentTime-c0r;if(x>=VRB-VRA){render(VRB);res();return}render(VRA+Math.max(0,x));busy('Đang ghi (thời gian thực)… '+fmt(x)+' / '+fmt(VRB-VRA));requestAnimationFrame(step)};step()});
  rec.stop();a.stop();await done;if(CANCEL)return;download(new Blob(chunks,{type:mime.split(';')[0]}),fileName(mime.startsWith('video/mp4')?'mp4':'webm'))}
$('mp4').onclick=exportMP4;

const SCN_NAMES={'mo-dau':'Mở đầu','den-dau':'Đèn dầu','chuon-chuon':'Chuồn chuồn','chong-chong':'Chong chóng','ca-la-dua':'Con cá lá dừa','ban-dan':'Bắn đạn','dieu-giay':'Diều giấy','an-ten':'Ăng-ten',
  'thuyen-giay':'Thuyền giấy','nuoc-noi':'Mùa nước nổi','lu-nuoc':'Lu nước & gáo dừa','dong-ho':'Đồng hồ Casio','brick-game':'Máy xếp gạch','que-toi':'Quê hương','credit':'Logo & credit'};
{const sel=$('scene');sel.add(new Option('Tất cả cảnh','all'));SECS.forEach((s,i)=>sel.add(new Option((i+1)+'. '+SCN_NAMES[s.id],i)));
  sel.onchange=()=>{const was=playing;pause();if(sel.value==='all'){SOLO=null;VRA=0;VRB=VDUR}else{SOLO=+sel.value;const s=SECS[SOLO];VRA=s.start;VRB=s.start+s.dur}

function fileName(ext){return 'hoi-do'+(SOLO!=null?'_'+String(SOLO+1).padStart(2,'0')+'-'+SECS[SOLO].id:'')+(TEXTMODE==='full'?'_day-du':TEXTMODE==='none'?'_khong-chu':'')+'.'+ext}
window.render=render;window.VDUR=VDUR;window.renderAudioWavB64=renderAudioWavB64;

/* ---- startup: fonts → text layers → first frame → prewarm the drawings in idle time ---- */
(async()=>{$('play').disabled=true;draw0();
  try{await Promise.all([document.fonts.load("400 35px 'Be Vietnam Pro'",'Hồi đó ạ'),document.fonts.load("300 23px 'Be Vietnam Pro'",'Hồi đó ạ'),document.fonts.load("italic 600 40px 'Lora'",'hồi đó'),
    document.fonts.load("bold 18px 'Be Vietnam Pro'",'HỒI ĐÓ'),IMG.decode().catch(()=>{})])}catch(e){}
  vPrep();READY=true;$('play').disabled=false;draw();
  const steps=vPrewarmSteps();const idle=window.requestIdleCallback||(f=>setTimeout(f,30));const next=()=>{const f=steps.shift();if(!f)return;if(!playing&&!EXPORTING){f();draw()}idle(next)};idle(next);
  window.APP_READY=true})();
function draw0(){ctx.fillStyle='#FBFCFD';ctx.fillRect(0,0,cv.width,cv.height)}
