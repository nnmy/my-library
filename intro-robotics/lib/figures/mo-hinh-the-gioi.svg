<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Mô hình thế giới: tưởng tượng kết quả của từng hành động trước khi làm</title>
  <!-- Tự vẽ, minh họa ý tưởng. My Academia / Robotics. -->
  <rect width="900" height="330" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <!-- khung hiện tại -->
  <rect x="20" y="110" width="170" height="120" fill="#fff" stroke="#1B1920" stroke-width="2"/>
  <rect x="20" y="200" width="170" height="30" fill="#E6D9C3"/>
  <rect x="60" y="176" width="22" height="24" fill="#7bcde8" stroke="#1B1920"/>
  <path d="M150 120V160L120 176" stroke="#59606B" stroke-width="7" stroke-linecap="round" fill="none"/>
  <text x="105" y="100" text-anchor="middle" font-weight="700">bây giờ</text>
  <text x="105" y="252" text-anchor="middle" font-size="12" fill="#59606B">camera thấy cái ly</text>
  <!-- mô hình -->
  <rect x="250" y="120" width="160" height="100" fill="#E3D7F2" stroke="#1B1920" stroke-width="2.5"/>
  <text x="330" y="156" text-anchor="middle" font-weight="700" font-size="14">mô hình thế giới</text>
  <text x="330" y="178" text-anchor="middle" font-size="12">“nếu làm vầy</text>
  <text x="330" y="194" text-anchor="middle" font-size="12">thì chuyện gì xảy ra?”</text>
  <path d="M192 170H246" stroke="#1B1920" stroke-width="2" marker-end="url(#a)"/>
  <!-- ba tương lai -->
  <path d="M412 150L520 60M412 170H520M412 190L520 280" stroke="#1B1920" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="440" y="86" font-size="11.5" transform="rotate(-38 440 86)">gạt ngang</text>
  <text x="440" y="164" font-size="11.5">kẹp ở quai</text>
  <text x="440" y="262" font-size="11.5" transform="rotate(38 440 262)">kẹp ở miệng</text>
  <g>
    <rect x="525" y="20" width="130" height="80" fill="#fff" stroke="#1B1920" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="525" y="80" width="130" height="20" fill="#E6D9C3"/>
    <rect x="610" y="88" width="24" height="12" fill="#7bcde8" stroke="#1B1920" transform="rotate(-80 622 94)"/>
    <text x="670" y="55" font-weight="700" fill="#d8312a">✗ ly đổ</text>
    <rect x="525" y="130" width="130" height="80" fill="#fff" stroke="#1B1920" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="525" y="190" width="130" height="20" fill="#E6D9C3"/>
    <rect x="575" y="140" width="22" height="24" fill="#7bcde8" stroke="#1B1920"/>
    <path d="M620 130V146L598 150" stroke="#59606B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="670" y="165" font-weight="700" fill="#3f9d6a">✓ ly được nhấc lên</text>
    <rect x="525" y="240" width="130" height="80" fill="#fff" stroke="#1B1920" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="525" y="300" width="130" height="20" fill="#E6D9C3"/>
    <rect x="565" y="276" width="22" height="24" fill="#7bcde8" stroke="#1B1920"/>
    <path d="M610 240V262L590 274" stroke="#59606B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="670" y="275" font-weight="700" fill="#B08A12">? trượt tay</text>
  </g>
  <text x="670" y="186" font-size="12" fill="#59606B">→ chọn cách này rồi mới làm thật</text>
  <text x="20" y="40" font-size="12.5" fill="#59606B">Giống bước “dự đoán” của bộ lọc Kalman (Phần 3),</text>
  <text x="20" y="58" font-size="12.5" fill="#59606B">nhưng mô hình học từ hàng triệu video,</text>
  <text x="20" y="76" font-size="12.5" fill="#59606B">và dự đoán luôn cả hình ảnh tương lai.</text>
</svg>
