<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>A* chấm điểm mỗi ô bằng f = g + h</title>
  <!-- Tự vẽ. My Academia / Robotics. -->
  <rect width="860" height="300" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker></defs>
  <g stroke="#DCE6EC" stroke-width="1"><rect x="40" y="60" width="40" height="40" fill="#fff"/><rect x="80" y="60" width="40" height="40" fill="#fff"/><rect x="120" y="60" width="40" height="40" fill="#fff"/><rect x="160" y="60" width="40" height="40" fill="#fff"/><rect x="200" y="60" width="40" height="40" fill="#fff"/><rect x="240" y="60" width="40" height="40" fill="#fff"/><rect x="280" y="60" width="40" height="40" fill="#fff"/><rect x="320" y="60" width="40" height="40" fill="#fff"/><rect x="360" y="60" width="40" height="40" fill="#fff"/><rect x="400" y="60" width="40" height="40" fill="#fff"/><rect x="440" y="60" width="40" height="40" fill="#fff"/><rect x="480" y="60" width="40" height="40" fill="#fff"/><rect x="40" y="100" width="40" height="40" fill="#fff"/><rect x="80" y="100" width="40" height="40" fill="#fff"/><rect x="120" y="100" width="40" height="40" fill="#fff"/><rect x="160" y="100" width="40" height="40" fill="#fff"/><rect x="200" y="100" width="40" height="40" fill="#fff"/><rect x="240" y="100" width="40" height="40" fill="#fff"/><rect x="280" y="100" width="40" height="40" fill="#fff"/><rect x="320" y="100" width="40" height="40" fill="#fff"/><rect x="360" y="100" width="40" height="40" fill="#fff"/><rect x="400" y="100" width="40" height="40" fill="#fff"/><rect x="440" y="100" width="40" height="40" fill="#fff"/><rect x="480" y="100" width="40" height="40" fill="#fff"/><rect x="40" y="140" width="40" height="40" fill="#fff"/><rect x="80" y="140" width="40" height="40" fill="#fff"/><rect x="120" y="140" width="40" height="40" fill="#fff"/><rect x="160" y="140" width="40" height="40" fill="#fff"/><rect x="200" y="140" width="40" height="40" fill="#fff"/><rect x="240" y="140" width="40" height="40" fill="#fff"/><rect x="280" y="140" width="40" height="40" fill="#fff"/><rect x="320" y="140" width="40" height="40" fill="#fff"/><rect x="360" y="140" width="40" height="40" fill="#fff"/><rect x="400" y="140" width="40" height="40" fill="#fff"/><rect x="440" y="140" width="40" height="40" fill="#fff"/><rect x="480" y="140" width="40" height="40" fill="#fff"/><rect x="40" y="180" width="40" height="40" fill="#fff"/><rect x="80" y="180" width="40" height="40" fill="#fff"/><rect x="120" y="180" width="40" height="40" fill="#fff"/><rect x="160" y="180" width="40" height="40" fill="#fff"/><rect x="200" y="180" width="40" height="40" fill="#fff"/><rect x="240" y="180" width="40" height="40" fill="#fff"/><rect x="280" y="180" width="40" height="40" fill="#fff"/><rect x="320" y="180" width="40" height="40" fill="#fff"/><rect x="360" y="180" width="40" height="40" fill="#fff"/><rect x="400" y="180" width="40" height="40" fill="#fff"/><rect x="440" y="180" width="40" height="40" fill="#fff"/><rect x="480" y="180" width="40" height="40" fill="#fff"/><rect x="40" y="220" width="40" height="40" fill="#fff"/><rect x="80" y="220" width="40" height="40" fill="#fff"/><rect x="120" y="220" width="40" height="40" fill="#fff"/><rect x="160" y="220" width="40" height="40" fill="#fff"/><rect x="200" y="220" width="40" height="40" fill="#fff"/><rect x="240" y="220" width="40" height="40" fill="#fff"/><rect x="280" y="220" width="40" height="40" fill="#fff"/><rect x="320" y="220" width="40" height="40" fill="#fff"/><rect x="360" y="220" width="40" height="40" fill="#fff"/><rect x="400" y="220" width="40" height="40" fill="#fff"/><rect x="440" y="220" width="40" height="40" fill="#fff"/><rect x="480" y="220" width="40" height="40" fill="#fff"/></g><rect x="40" y="140" width="40" height="40" fill="#3f9d6a" stroke="#1B1920" stroke-width="2"/><text x="60" y="205.0" text-anchor="middle" font-weight="700">đầu</text><rect x="480" y="140" width="40" height="40" fill="#d8312a" stroke="#1B1920" stroke-width="2"/><text x="500" y="205.0" text-anchor="middle" font-weight="700">đích</text><rect x="240" y="100" width="40" height="40" fill="#f2c230" stroke="#1B1920" stroke-width="2.5"/><path d="M60 160 L100 160 L140 160 L180 160 L220 160 L220 120 L260 120" fill="none" stroke="#3787c4" stroke-width="4" marker-end="url(#a)"/><path d="M260 120 L500 160" stroke="#d8312a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="120" y="210" fill="#3787c4" font-weight="700">g = 6 bước đã đi (biết chắc)</text>
  <text x="320" y="88" fill="#d8312a" font-weight="700">h = 7 bước, đoán theo đường thẳng</text>
  <text x="260" y="64" text-anchor="middle" font-weight="700">ô đang xét</text>
  <rect x="560" y="50" width="280" height="200" fill="#fff" stroke="#1B1920" stroke-width="1.6"/>
  <text x="575" y="82" font-weight="700" font-size="17">f = g + h = 13</text>
  <text x="575" y="110" font-size="12.5">Mỗi lượt, A* chọn ô có f nhỏ nhất</text>
  <text x="575" y="128" font-size="12.5">trong các ô đang chờ, rồi mở rộng tiếp.</text>
  <text x="575" y="158" font-size="12.5" fill="#59606B">Loang đều chỉ xài g: lan mọi hướng.</text>
  <text x="575" y="178" font-size="12.5" fill="#59606B">Tham lam chỉ xài h: lao về đích,</text>
  <text x="575" y="196" font-size="12.5" fill="#59606B">dễ đi lòng vòng.</text>
  <text x="575" y="226" font-size="12.5" fill="#59606B">A* xài cả hai: vừa nhắm hướng</text>
  <text x="575" y="244" font-size="12.5" fill="#59606B">vừa nhớ đã tốn bao nhiêu.</text>
</svg>