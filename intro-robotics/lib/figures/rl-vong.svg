<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1B1920">
  <title>Vòng lặp học tăng cường: tác tử, môi trường, trạng thái, hành động, phần thưởng</title>
  <!-- Tự vẽ, theo Sutton và Barto (2018), Hình 3.1. My Academia / Robotics. -->
  <rect width="900" height="320" fill="#FBFCFD"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1B1920"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f9d6a"/></marker></defs>
  <g text-anchor="middle">
    <rect x="320" y="30" width="260" height="90" fill="#E3D7F2" stroke="#1B1920" stroke-width="2"/>
    <text x="450" y="60" font-weight="700" font-size="16">Tác tử (robot)</text>
    <text x="450" y="82">chính sách: thấy trạng thái này</text>
    <text x="450" y="100">thì làm hành động nào?</text>
    <rect x="320" y="200" width="260" height="90" fill="#D5EDDD" stroke="#1B1920" stroke-width="2"/>
    <text x="450" y="230" font-weight="700" font-size="16">Môi trường</text>
    <text x="450" y="252">thế giới thật hoặc mô phỏng:</text>
    <text x="450" y="270">sàn nhà, trọng lực, cái ly…</text>
  </g>
  <path d="M582 75H700V245H586" fill="none" stroke="#1B1920" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="712" y="150" font-weight="700">hành động a</text>
  <text x="712" y="168" font-size="12" fill="#59606B">bước chân trái, nhích khớp 3…</text>
  <path d="M318 230H200V90H316" fill="none" stroke="#1B1920" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="188" y="130" text-anchor="end" font-weight="700">trạng thái mới s</text>
  <text x="188" y="148" text-anchor="end" font-size="12" fill="#59606B">góc khớp, hình camera…</text>
  <path d="M318 262H40V60H316" fill="none" stroke="#3f9d6a" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="52" y="286" font-weight="700" fill="#3f9d6a">phần thưởng r</text>
  <text x="160" y="286" font-size="12" fill="#3f9d6a">+1 đi tới, −10 té</text>
  <text x="450" y="312" text-anchor="middle" font-size="12.5" fill="#59606B">Mục tiêu: chọn hành động sao cho tổng phần thưởng về lâu về dài là lớn nhất.</text>
</svg>
