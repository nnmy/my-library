<!DOCTYPE html>
<html lang="vi" class="gate-locked">
<head>
<meta charset="utf-8">
<style>html.gate-locked body{visibility:hidden!important}</style>
<script src="../common/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas hình ảnh y khoa | My N. Nguyen</title>
<meta name="description" content="Tra cứu tên và chức năng các cấu trúc giải phẫu trên ảnh y khoa, bắt đầu với MRI não T1/T2 và phân vùng.">
<link rel="icon" type="image/svg+xml" href="https://nnmy.github.io/lib/logo-my.svg">
<link rel="stylesheet" href="lib/fonts/fonts.css">
<link rel="stylesheet" href="../common/site.css">
<link rel="stylesheet" href="lib/atlas.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; list-style: none; padding: 0; margin: 0 0 40px; }
  .card { display: flex; flex-direction: column; height: 100%; background: #fff; color: var(--ink); text-decoration: none;
    border: 2px solid var(--ink); box-shadow: 0 6px 18px rgba(27,25,32,.10); padding: 20px 20px 18px; transition: transform .15s, box-shadow .15s; }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(27,25,32,.16); }
  .card.soon { box-shadow: 0 4px 12px rgba(27,25,32,.06); border-color: #9DA4AD; color: var(--muted); }
  .card-body { display: flex; align-items: flex-start; gap: 16px; flex: 1; }
  .card h3 .num { color: var(--sea); margin-right: 12px; }
  .card.soon .num { color: var(--muted); }
  .card h3 { margin: 2px 0 6px; font: 400 30px/1.05 var(--pixel-vi); }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; text-align: justify; hyphens: auto; }
  .page-head .lead { text-align: justify; hyphens: auto; }
  .grid > li, .card h3 { text-align: left; }
  .page-head h1 { align-items: flex-start; }
  .page-head h1 .dot { margin-top: .42em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
  .tags li { font-size: 12.5px; padding: 1px 9px; background: var(--mist); border: 1px solid var(--line); color: var(--ink); }
  .badge { align-self: flex-start; margin-top: 12px; font-size: 12.5px; font-weight: 600; padding: 1px 8px; border: 1px dashed #9DA4AD; }
  .others { margin: 0 0 48px; }
  .others h2 { font: 700 22px/1.3 var(--body); margin-bottom: 8px; }
  .others ul { margin: 0; padding-left: 20px; }
  .others li { margin: 4px 0; text-align: left; }
  .others li span { color: var(--muted); font-size: 14.5px; }
  .others a.quiet { color: inherit; text-decoration: none; cursor: text; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
<noscript><p style="visibility:visible;margin:40px auto;max-width:520px;padding:0 20px;font:16px system-ui,sans-serif">Trang cần bật JavaScript để xem.</p></noscript>
<nav class="site-nav" aria-label="Site"></nav>
<script src="../common/nav.js"></script>

<main class="wrap">
  <header class="page-head">
    <h1><span class="dot"></span>Atlas ảnh y khoa</h1>
    <p class="lead">Tra cứu tên và chức năng các cấu trúc giải phẫu trên ảnh y khoa. Web có hỗ trợ ghim các nội dung quan tâm rồi xuất thành một file PDF.</p>
  </header>

  <ul class="grid" id="pages"></ul>

  <section class="others" aria-labelledby="othersHead">
    <h2 id="othersHead">Tiện ích</h2>
    <ul id="others"></ul>
  </section>

</main>

<footer class="site-foot">
  <div class="cat-lane">
    <canvas id="catCanvas" aria-hidden="true"></canvas>
    <button id="catBtn" aria-label="Chơi minigame" title="Chơi minigame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="bg" cx="12" cy="12" r="10.75" fill="#fff" stroke="#1B1920" stroke-width="1.5"/><path d="M9.6 7.4 17 12l-7.4 4.6z" fill="#1B1920" stroke="#1B1920" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </button>
    <div class="foot-row"><span>Content by My N. Nguyen x AI Agents</span></div>
  </div>
</footer>

<script>
/* =====================================================================
   EDIT: danh sách trang con
   ===================================================================== */
const PAGES = [
  {
    num: '1', name: 'MRI não', href: '1-brain-mri.html', done: true,
    desc: 'Ảnh T1 và T2 cùng phân vùng hơn 50 cấu trúc mỗi bán cầu não.',
    tags: ['MRI', 'Brain', 'Segmentation'],
  },
  {
    num: '2', name: 'X-quang ngực', href: '2-chest-xray.html', done: true,
    desc: 'Phim ngực thẳng: các mốc giải phẫu, và dấu hiệu của lao phổi, viêm phổi, tràn dịch, tràn khí màng phổi, tim to, u và nốt phổi.',
    tags: ['Chest X-ray', 'Anatomy', 'Lung disease'],
  },
  {
    num: '3', name: 'Điện tâm đồ', href: '3-ecg.html', done: true,
    desc: 'ECG 12 chuyển đạo thật: nhồi máu cơ tim, rung nhĩ, block nhánh trái, phì đại thất trái, đặt cạnh người thường cùng giới và tuổi.',
    tags: ['ECG', '12-lead', 'Arrhythmia'],
  },
  {
    num: '4', name: 'Phình mạch não', href: '4-brain-aneurysm.html', done: true,
    desc: 'Ảnh chụp mạch (DSA) hệ đốt sống–nền, mô hình 3D túi phình thật xoay được, vị trí phình mạch thường gặp, các phương pháp chẩn đoán hình ảnh và thang điểm nguy cơ vỡ PHASES.',
    tags: ['DSA', '3D', 'Aneurysm'],
  },
];
/* EDIT: mục Tiện ích (dưới lưới thẻ): liên kết chữ, không có thẻ */
const OTHERS = [
  // quiet: đoạn chữ trong desc được gắn liên kết ẩn (trông như chữ thường)
  { name: 'Phân đoạn MRI đầu', href: 'head-mri.html', desc: 'T1, T2, và 14 loại mô', quiet: { text: '14 loại mô', href: 'head-seg.html' } },
  { name: 'Xem ảnh NIfTI', href: 'view_nifti.html', desc: 'mở file .nii trên máy, xem lát cắt, chồng nhãn, xuất ảnh mosaic' },
];

const list = document.getElementById('pages');
PAGES.forEach(p => {
  const li = document.createElement('li');
  const card = document.createElement(p.done ? 'a' : 'div');
  card.className = 'card' + (p.done ? '' : ' soon');
  if (p.done) card.href = p.href; else card.setAttribute('aria-disabled', 'true');
  const body = document.createElement('div'); body.className = 'card-body';
  const text = document.createElement('div');
  const h = document.createElement('h3');
  const num = document.createElement('span'); num.className = 'num'; num.textContent = p.num;
  h.append(num, document.createTextNode(p.name));   // số phần + tiêu đề trên cùng một dòng
  const d = document.createElement('p'); d.textContent = p.desc;
  text.append(h, d);
  body.append(text);
  const tags = document.createElement('ul'); tags.className = 'tags';
  (p.tags || []).slice(0, 3).forEach(t => { const x = document.createElement('li'); x.textContent = t; tags.appendChild(x); });
  card.append(body);
  if (tags.children.length) card.append(tags);
  if (!p.done) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'Chưa mần'; card.appendChild(b); }
  li.appendChild(card); list.appendChild(li);
});
const others = document.getElementById('others');
OTHERS.forEach(o => {
  const li = document.createElement('li'), a = document.createElement('a');
  a.href = o.href; a.textContent = o.name; li.appendChild(a);
  if (o.desc) {
    const d = document.createElement('span'), txt = ': ' + o.desc, q = o.quiet, i = q ? txt.indexOf(q.text) : -1;
    if (i < 0) d.textContent = txt;
    else {
      const k = document.createElement('a'); k.href = q.href; k.className = 'quiet'; k.textContent = q.text;
      d.append(txt.slice(0, i), k, txt.slice(i + q.text.length));
    }
    li.appendChild(d);
  }
  others.appendChild(li);
});
</script>
<script src="../common/site.js" defer></script>
<script data-goatcounter="https://nnmy99.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
